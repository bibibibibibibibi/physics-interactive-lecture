<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>气液相变 · 本地模型实验</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{color:#16354f;background:linear-gradient(135deg,#f7fbff,#eef7fd);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
    #app{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr) 100px;padding:0 18px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #c4dbe9;white-space:nowrap}
    #title{font-size:clamp(22px,1.72vw,31px);font-weight:700;color:#144c71}
    #model{font-size:clamp(20px,1.44vw,26px);color:#486276}
    main{position:relative;min-height:0}canvas{display:block;width:100%;height:100%}
    footer{display:flex;flex-direction:column;justify-content:center;gap:8px;border-top:1px solid #c4dbe9}
    #controls{display:flex;align-items:center;gap:18px;white-space:nowrap;font-size:clamp(22px,1.6vw,29px)}
    #slider-label{font-weight:650;min-width:170px}input[type=range]{flex:1;min-width:80px;height:34px;accent-color:#127dae;cursor:pointer}
    output{font-variant-numeric:tabular-nums;font-weight:700;min-width:130px;color:#155d88}
    button{font:inherit;font-size:clamp(22px,1.55vw,28px);color:#155d88;background:#fff;border:2px solid #86bcd5;border-radius:10px;padding:9px 20px;cursor:pointer}
    button:hover,button:focus-visible{background:#e1f3fc;outline:3px solid #a5dbf1;outline-offset:1px}
    button.primary{color:#fff;background:#177eac;border-color:#177eac}button.active{color:#fff;background:#725199;border-color:#725199}
    #note{font-size:clamp(20px,1.35vw,24px);line-height:1.25;color:#526e80;white-space:nowrap}
    #focus-controls{display:none;gap:15px;flex:1}#focus-controls button{padding:8px 19px}
    @media(max-width:1250px){#app{padding:0 12px;grid-template-rows:52px minmax(0,1fr) 105px}#controls{gap:12px}button{padding:8px 14px}#slider-label{min-width:145px}#model{font-size:20px}#focus-controls{gap:8px}#focus-controls button{padding:8px 12px}}
  </style>
</head>
<body>
<div id="app">
  <header><span id="title"></span><span id="model">约化 vdW 模型：θ = T/Tc，v = Vm/Vc，p = P/Pc</span></header>
  <main><canvas id="plot" aria-label="范德瓦尔斯气液相变模型图"></canvas></main>
  <footer>
    <div id="controls">
      <label id="slider-label" for="parameter"></label><input id="parameter" type="range"><output id="parameter-value" for="parameter"></output>
      <div id="focus-controls"><button data-focus="all">全部区间</button><button data-focus="gas">B→C 气体</button><button data-focus="liquid">F→E 液体</button><button data-focus="unstable">E→C 中段</button></div>
      <button id="special-button" class="primary"></button><button id="demo-button">演示</button><button id="reset-button">归位</button>
    </div>
    <div id="note"></div>
  </footer>
</div>
<script>
/*
 * Adapted from the source pv_presentation.html (CO2 physics engine, analytic
 * integral, Maxwell construction and A–G naming). Normalized with Tc, Vc, Pc:
 * p(v,theta)=8 theta/(3v-1)-3/v^2; v>1/3. No dependencies or network requests.
 * The source's cubic-root/area logic is retained in analytic form, but branch
 * roots are bracketed on monotone intervals for numerical stability near Tc.
 */
(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  const modes=['andrews','family','maxwell','meta'];
  const requested=new URLSearchParams(location.search).get('embed')||'andrews';
  const mode=modes.includes(requested)?requested:'andrews';
  const canvas=$('plot'),ctx=canvas.getContext('2d');
  const colors={ink:'#153b57',grid:'#d5e5ee',blue:'#127eae',gas:'#188ab3',liq:'#2358a0',purple:'#7b4ba3',red:'#c13e48',orange:'#d08922',teal:'#138ca0',muted:'#7296ad'};
  const titles={andrews:'恒温压缩：气态 → 气液共存 → 液态',family:'等温线族：从低于临界温度到高于临界温度',maxwell:'移动水平线，寻找两块相等的面积',meta:'沿一条等温线辨认稳定、亚稳与不稳定区间'};
  const theta0=mode==='andrews'?.94:.90;
  const defaults={theta:theta0,v:3.3,p:0,progress:0,focus:'all',running:false};
  let state={...defaults},frame=0,nonce=0,W=0,H=0,F=30,plot=null;
  let model=null,lastLecture=null,manualOverride=false;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function pressure(v,t){return 8*t/(3*v-1)-3/(v*v)}
  function derivative(v,t){return -24*t/((3*v-1)**2)+6/(v**3)}
  function primitive(v,t){return (8*t/3)*Math.log(3*v-1)+3/v}
  function integral(v1,v2,t){return (8*t/3)*Math.log((3*v2-1)/(3*v1-1))+3*(1/v2-1/v1)}
  function bisect(fn,lo,hi,iterations=90){
    let flo=fn(lo),fhi=fn(hi);
    if(!Number.isFinite(flo)||!Number.isFinite(fhi)||flo*fhi>0)throw new Error('Root is not bracketed');
    if(flo===0)return lo;if(fhi===0)return hi;
    for(let i=0;i<iterations;i++){
      const mid=(lo+hi)/2,f=fn(mid);
      if(f===0||hi-lo<2e-14*Math.max(1,Math.abs(mid)))return mid;
      if((flo<0)===(f<0)){lo=mid;flo=f}else{hi=mid;fhi=f}
    }
    return (lo+hi)/2;
  }
  function spinodals(t){
    if(!(t>0)||t>1)return null;if(t===1)return {vl:1,vg:1,pmin:1,pmax:1};
    const f=v=>((3*v-1)**2)/(4*v**3)-t;
    let hi=2;while(f(hi)>0&&hi<1e12)hi*=2;
    const vl=bisect(f,1/3+1e-12,1),vg=bisect(f,1,hi);
    return {vl,vg,pmin:pressure(vl,t),pmax:pressure(vg,t)};
  }
  function rootsAt(t,p,sp=spinodals(t)){
    if(!sp||!(t<1)||!(p>Math.max(0,sp.pmin))||!(p<sp.pmax))return null;
    const f=v=>pressure(v,t)-p;
    let hi=Math.max(3,sp.vg*2);while(f(hi)>0&&hi<1e12)hi*=2;
    return {vl:bisect(f,1/3+1e-12,sp.vl),vm:bisect(f,sp.vl,sp.vg),vg:bisect(f,sp.vg,hi)};
  }
  function areas(t,p,r=rootsAt(t,p)){
    if(!r)return null;
    const a1=p*(r.vm-r.vl)-integral(r.vl,r.vm,t);
    const a2=integral(r.vm,r.vg,t)-p*(r.vg-r.vm);
    return {...r,a1:Math.max(0,a1),a2:Math.max(0,a2),residual:a2-a1};
  }
  function maxwell(t){
    if(!(t>0&&t<1))return null;
    const sp=spinodals(t),span=sp.pmax-Math.max(0,sp.pmin);
    const pad=span*1e-7;
    let lo=Math.max(0,sp.pmin)+pad,hi=sp.pmax-pad;
    // Residual I-p Δv decreases strictly with p: d(residual)/dp=-Δv.
    let rlo=areas(t,lo),rhi=areas(t,hi);
    if(!rlo||!rhi||rlo.residual<0||rhi.residual>0)throw new Error('Maxwell bracket failed');
    for(let i=0;i<85;i++){
      const p=(lo+hi)/2,r=areas(t,p);
      if(r.residual>0)lo=p;else hi=p;
      if(hi-lo<1e-14)break;
    }
    const ps=(lo+hi)/2,r=areas(t,ps);
    return {...r,...sp,vsLiquid:sp.vl,vsGas:sp.vg,vl:r.vl,vg:r.vg,ps};
  }
  // The family view does not need a coexistence calculation at each slider
  // tick (the critical limit has zero area); avoid ill-conditioned area solves.
  function recompute(){model=mode==='family'?null:maxwell(state.theta)}
  function pressureBounds(){
    const s=spinodals(theta0),pad=(s.pmax-s.pmin)*.003;
    // Keep all three pressure intersections inside the fixed projection frame.
    // This is a presentation range restriction, not a change to the EOS.
    return [Math.max(0,s.pmin+pad,pressure(3.45,theta0)),s.pmax-pad];
  }
  function initialP(){const m=maxwell(theta0),s=spinodals(theta0);return m.ps+.13*(s.pmax-s.pmin)}
  function phaseAt(v,m){
    if(v>=m.vg)return {name:'气态',liquid:0,liquidVolume:0,p:pressure(v,state.theta)};
    if(v<=m.vl)return {name:'液态',liquid:1,liquidVolume:1,p:pressure(v,state.theta)};
    const liquid=(m.vg-v)/(m.vg-m.vl);
    return {name:'气液共存',liquid,liquidVolume:liquid*m.vl/v,p:m.ps};
  }
  function cancel(){nonce++;if(frame)cancelAnimationFrame(frame);frame=0;state.running=false}
  function getState(){
    const m=model;
    return {mode,...state,model:m?{theta:state.theta,ps:m.ps,vl:m.vl,vg:m.vg,vm:m.vm,vsLiquid:m.vsLiquid,vsGas:m.vsGas}:null,
      phase:mode==='andrews'?phaseAt(state.v,m):null,areas:mode==='maxwell'?areas(state.theta,state.p):null};
  }
  function setState(values={},options={}){
    if(!options.animation)cancel();
    if(Number.isFinite(values.theta))state.theta=mode==='family'?clamp(values.theta,.85,1.15):theta0;
    if(Number.isFinite(values.v))state.v=clamp(values.v,volumeEnd(),3.3);
    if(Number.isFinite(values.p)){const [lo,hi]=pressureBounds();state.p=clamp(values.p,lo,hi)}
    if(Number.isFinite(values.progress))state.progress=clamp(values.progress,0,1);
    if(['all','gas','liquid','unstable'].includes(values.focus))state.focus=values.focus;
    recompute();sync();draw();return getState();
  }
  function volumeEnd(){return maxwell(.94).vl*.93}
  function reset(){cancel();state={...defaults,p:initialP()};recompute();sync();draw();return getState()}
  function equalize(){return setState({p:maxwell(theta0).ps,progress:1})}
  function critical(){return setState({theta:1,progress:.5})}
  function smooth(x){return x*x*(3-2*x)}
  function valuesAtProgress(q){
    q=clamp(q,0,1);
    if(mode==='andrews'){
      const m=maxwell(.94),v0=3.3,ve=volumeEnd();
      const v=q<.28?v0+(m.vg-v0)*smooth(q/.28):q<.78?m.vg+(m.vl-m.vg)*smooth((q-.28)/.5):m.vl+(ve-m.vl)*smooth((q-.78)/.22);
      return {v,progress:q};
    }
    if(mode==='family')return {theta:.85+.30*smooth(q),progress:q};
    if(mode==='maxwell'){
      const m=maxwell(.90),sp=spinodals(.90),span=sp.pmax-sp.pmin,start=initialP(),below=m.ps-.15*span;
      return {p:q<.40?start+(below-start)*smooth(q/.40):below+(m.ps-below)*smooth((q-.40)/.60),progress:q};
    }
    return {focus:q<.33?'gas':q<.66?'liquid':'unstable',progress:q};
  }
  function demo(duration){
    reset();const token=nonce;const start=performance.now();state.running=true;
    duration=Number.isFinite(duration)?clamp(duration,300,60000):mode==='andrews'?18000:mode==='family'?12000:mode==='maxwell'?8000:0;
    if(mode==='meta'){setState({focus:'all'});return}
    function tick(now){
      if(token!==nonce)return;
      const q=clamp((now-start)/duration,0,1);setState(valuesAtProgress(q),{animation:true});
      state.running=q<1;$('demo-button').textContent=state.running?'重新演示':'演示';
      if(q<1)frame=requestAnimationFrame(tick);else frame=0;
    }
    frame=requestAnimationFrame(tick);
  }
  /* Shared timelineSync protocol. The lecture owns the absolute clock;
   * static presentation owns its step. Manual controls remain usable while
   * the lecture is paused at exactly the same position. */
  function lectureState(data){
    const step=Number(data.step),time=Number(data.pageTime);
    if(!['interactive','static'].includes(data.mode)||!Number.isFinite(step)||!Number.isFinite(time)||time<0)return false;
    const same=lastLecture&&lastLecture.pageId===data.pageId&&lastLecture.mode===data.mode&&lastLecture.step===step&&Math.abs(lastLecture.time-time)<1e-7;
    if(manualOverride&&same&&!data.playing)return true;
    manualOverride=false;
    const start=Number(data.steps?.['2']),duration=mode==='andrews'?18:mode==='family'?12:8;
    let progress=0,cueValid=Number.isFinite(start);
    if(mode==='meta'||step<2){reset()}
    else if(data.mode==='static'){progress=1;setState(valuesAtProgress(1))}
    else if(cueValid){progress=clamp((time-start)/duration,0,1);setState(valuesAtProgress(progress))}
    else{reset()}
    lastLecture={pageId:data.pageId,mode:data.mode,step,time,playing:!!data.playing,progress,cueValid};
    return true;
  }
  function manual(action){manualOverride=true;return action()}
  function sync(){
    const input=$('parameter');$('demo-button').textContent=state.running?'重新演示':'演示';
    if(mode==='andrews'){
      input.value=state.v;$('parameter-value').textContent='v = '+state.v.toFixed(3);
      $('note').textContent='恒温、准静态；液化比例按物质的量计。图像是模型示意，不是 CO₂ 实测数据。';
    }else if(mode==='family'){
      input.value=state.theta;$('parameter-value').textContent='θ = '+state.theta.toFixed(3);
      $('note').textContent='粗蓝线为当前温度；临界点 K：(v, p, θ) = (1, 1, 1)。';
    }else if(mode==='maxwell'){
      input.value=state.p;$('parameter-value').textContent='p₀ = '+state.p.toFixed(4);
      $('note').textContent='A₁ = 左侧线下 DEF 面积；A₂ = 右侧线上 BCD 面积。面积单位为 Pc Vc（每摩尔）。';
    }else{
      const slopes={all:'负斜率是机械稳定的必要条件；亚稳态仍需成核才进入两相平衡。',gas:'B→C：过冷（过饱和）气体；斜率为负，但不是全局自由能最低态。',liquid:'F→E：过热液体；斜率为负，但不是全局自由能最低态。',unstable:'E→C：斜率为正，κT < 0；均匀相对微小密度扰动不稳定。'};
      $('note').textContent=slopes[state.focus];
      document.querySelectorAll('[data-focus]').forEach(b=>b.classList.toggle('active',b.dataset.focus===state.focus));
    }
  }
  function resize(){
    const r=canvas.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
    W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    F=clamp(W/58,22,31);
  }
  function text(str,x,y,color=colors.ink,size=F,align='left',weight=500){ctx.fillStyle=color;ctx.font=weight+' '+size+'px "Microsoft YaHei","PingFang SC",sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(str,x,y)}
  function line(x1,y1,x2,y2,color,width=2,dash=[]){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
  function X(v){return plot.x+(v-plot.vmin)/(plot.vmax-plot.vmin)*plot.w}
  function Y(p){return plot.y+(plot.pmax-p)/(plot.pmax-plot.pmin)*plot.h}
  function withClip(drawFn){ctx.save();ctx.beginPath();ctx.rect(plot.x,plot.y,plot.w,plot.h);ctx.clip();drawFn();ctx.restore()}
  function axes(){
    let vTicks=mode==='andrews'?[.5,1,1.5,2,2.5,3]:[.5,1,1.5,2,2.5,3,3.5];
    for(const v of vTicks){line(X(v),plot.y,X(v),plot.y+plot.h,colors.grid,1);text(v.toFixed(1),X(v),plot.y+plot.h+F*.7,colors.muted,F*.8,'center')}
    for(const p of [0,.25,.5,.75,1,1.25,1.5,1.75,2])if(p>=plot.pmin&&p<=plot.pmax){line(plot.x,Y(p),plot.x+plot.w,Y(p),colors.grid,1);text(p.toFixed(2),plot.x-12,Y(p),colors.muted,F*.8,'right')}
    line(plot.x,plot.y,plot.x,plot.y+plot.h,colors.ink,2);line(plot.x,plot.y+plot.h,plot.x+plot.w,plot.y+plot.h,colors.ink,2);
    text('p',plot.x-F*.9,plot.y-F*.9,colors.ink,F,'center',700);text('v',plot.x+plot.w+F*.6,plot.y+plot.h,colors.ink,F,'center',700);
  }
  function curve(t,col,width=3,v1=plot.vmin,v2=plot.vmax,dash=[],physical=false,m=null){
    ctx.strokeStyle=col;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();let first=true;
    const count=Math.max(50,Math.ceil(plot.w*(v2-v1)/(plot.vmax-plot.vmin)/1.5));
    for(let i=0;i<=count;i++){
      const v=v1+(v2-v1)*i/count;
      const p=physical&&m&&v>m.vl&&v<m.vg?m.ps:pressure(v,t);
      if(first){ctx.moveTo(X(v),Y(p));first=false}else ctx.lineTo(X(v),Y(p));
    }ctx.stroke();ctx.setLineDash([]);
  }
  function point(v,p,name,dx=12,dy=-23,color=colors.ink){
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(X(v),Y(p),5.5,0,Math.PI*2);ctx.fill();text(name,X(v)+dx,Y(p)+dy,color,F*.95,'left',750);
  }
  function callout(str,x,y,anchorX,anchorY,col=colors.ink){
    ctx.font='650 '+F+'px "Microsoft YaHei","PingFang SC",sans-serif';const tw=ctx.measureText(str).width;
    line(x,y+F*.55,anchorX,anchorY,col,2);ctx.fillStyle='rgba(248,252,255,.96)';ctx.fillRect(x-tw/2-8,y-F*.65,tw+16,F*1.3);text(str,x,y,col,F,'center',650);
  }
  function headerReadout(items){
    let x=20;for(const [label,color] of items){text(label,x,F*.9,color||colors.ink,F,'left',650);x+=ctx.measureText(label).width+F*1.4;}
  }
  function cylinder(m){
    const ph=phaseAt(state.v,m),leftW=plot.x-115;
    const cx=leftW*.32,cy=F*2.7,cw=Math.min(195,leftW*.35),ch=H-cy-F*2.6,bottom=cy+ch;
    const interior=Math.max(30,ch*state.v/3.3),piston=bottom-interior;
    const liqH=interior*ph.liquidVolume,gasH=interior-liqH;
    ctx.fillStyle='rgba(186,232,248,.18)';ctx.fillRect(cx-20,cy-15,cw+40,ch+30);ctx.strokeStyle='#6fb2ce';ctx.lineWidth=2;ctx.setLineDash([7,6]);ctx.strokeRect(cx-20,cy-15,cw+40,ch+30);ctx.setLineDash([]);
    ctx.fillStyle='#ecf5fa';ctx.fillRect(cx,piston,cw,gasH);
    if(gasH>2){
      const grad=ctx.createLinearGradient(cx,piston,cx+cw,piston+gasH);grad.addColorStop(0,'#e5f6fe');grad.addColorStop(1,'#c6eaf6');ctx.fillStyle=grad;ctx.fillRect(cx,piston,cw,gasH);
      ctx.save();ctx.beginPath();ctx.rect(cx+7,piston+7,cw-14,Math.max(0,gasH-14));ctx.clip();
      const n=Math.ceil(36*(1-ph.liquid));
      for(let i=0;i<n;i++){const a=(i*.61803398875+.08)%1,b=(i*.41421356237+.13)%1;ctx.fillStyle=colors.gas;ctx.beginPath();ctx.arc(cx+10+a*(cw-20),piston+10+b*Math.max(0,gasH-20),3.8,0,Math.PI*2);ctx.fill()}
      ctx.restore();
    }
    if(liqH>.2){const grad=ctx.createLinearGradient(0,bottom-liqH,0,bottom);grad.addColorStop(0,'#57abd7');grad.addColorStop(1,'#245e9b');ctx.fillStyle=grad;ctx.fillRect(cx,bottom-liqH,cw,liqH);line(cx,bottom-liqH,cx+cw,bottom-liqH,'#d4f6ff',2)}
    line(cx,cy,cx,bottom,colors.ink,4);line(cx+cw,cy,cx+cw,bottom,colors.ink,4);line(cx,bottom,cx+cw,bottom,colors.ink,4);
    ctx.fillStyle='#8099a7';ctx.fillRect(cx+1,piston-9,cw-2,17);ctx.fillStyle='#b6c9d3';ctx.fillRect(cx+2,piston-9,cw-4,5);
    line(cx+cw/2,cy-38,cx+cw/2,piston-9,'#678998',7);
    const right=cx+cw+43;
    text('θ = 0.94',cx+cw/2,cy-F*1.4,colors.blue,F,'center',650);
    text('恒温热浴',cx+cw/2,bottom+F*1.2,colors.blue,F*.95,'center',650);
    text(ph.name,right,cy+F*1.3,ph.name==='液态'?colors.liq:colors.gas,F,'left',700);
    text('p = '+ph.p.toFixed(3),right,cy+F*3,colors.ink,F,'left',650);
    text('液化比例',right,cy+F*5,colors.ink,F*.95,'left',600);
    text((100*ph.liquid).toFixed(0)+'%',right,cy+F*6.6,colors.liq,F*1.3,'left',750);
    text('（按物质的量）',right,cy+F*8,colors.muted,F*.8,'left',500);
  }
  function drawAndrews(){
    const m=model,ph=phaseAt(state.v,m);
    plot={x:W*.425,y:F*2.4,w:W*.55,h:H-F*4.4,vmin:.48,vmax:3.4,pmin:.25,pmax:1.7};axes();
    text('共存压强 ps = '+m.ps.toFixed(3),plot.x,F*.9,colors.ink,F,'left',650);
    withClip(()=>{curve(.94,'#a9c8da',3,plot.vmin,plot.vmax,[],true,m);if(state.v<3.3-1e-7)curve(.94,colors.blue,5,state.v,3.3,[],true,m)});
    point(state.v,ph.p,'',0,0,colors.red);point(m.vg,m.ps,'B',10,-27,colors.ink);point(m.vl,m.ps,'F',-28,28,colors.ink);
    text('气液共存',X((m.vl+m.vg)/2),Y(m.ps)+F*1.15,colors.blue,F*.95,'center',650);
    text('气态',X(2.85),Y(pressure(2.85,.94))+F*1.2,colors.gas,F*.95,'center',650);
    cylinder(m);
  }
  function drawFamily(){
    const role=state.theta<1-1e-6?'θ < 1：出现两处极值':state.theta>1+1e-6?'θ > 1：单调下降':'θ = 1：临界拐点';
    headerReadout([['当前 θ = '+state.theta.toFixed(3),colors.blue],[role,colors.ink]]);
    plot={x:F*3.5,y:F*2.55,w:W-F*5,h:H-F*4.8,vmin:.48,vmax:3.65,pmin:.0,pmax:2};axes();
    withClip(()=>{
      for(const [t,c] of [[.85,'#86b5c5'],[.90,'#76ac9c'],[1.10,'#c9a6aa'],[1.15,'#bdabc8']])curve(t,c,2.5);
      curve(1,colors.orange,4,plot.vmin,plot.vmax,[10,6]);curve(state.theta,colors.blue,5.5);
    });
    point(1,1,'K',13,-28,colors.orange);
    let lx=plot.x+plot.w*.66,ly=plot.y+F*.4;
    line(lx,ly,lx+50,ly,colors.blue,5);text('当前温度',lx+65,ly,colors.blue,F*.95,'left',650);
    line(lx,ly+F*1.5,lx+50,ly+F*1.5,colors.orange,4,[10,6]);text('临界 θ = 1',lx+65,ly+F*1.5,colors.orange,F*.95,'left',650);
    for(const [t,c] of [[.85,'#508fa9'],[1.15,'#90659b']])text('θ = '+t.toFixed(2),X(3.3),Y(pressure(3.3,t))+(t<1?F*.75:-F*.85),c,F*.9,'center',600);
  }
  function fillArea(v1,v2,p,t,color){
    ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(X(v1),Y(p));
    for(let i=0;i<=200;i++){const v=v1+(v2-v1)*i/200;ctx.lineTo(X(v),Y(pressure(v,t)))}
    ctx.lineTo(X(v2),Y(p));ctx.closePath();ctx.fill();
  }
  function drawMaxwell(){
    const r=areas(.90,state.p),equal=Math.abs(r.residual)<1e-6;
    headerReadout([['θ = 0.90',colors.ink],['A₁ = '+r.a1.toFixed(4),colors.teal],['A₂ = '+r.a2.toFixed(4),colors.orange],[equal?'A₁ = A₂   →   ps = '+state.p.toFixed(4):'A₂ − A₁ = '+r.residual.toFixed(4),equal?colors.blue:colors.red]]);
    plot={x:F*3.5,y:F*2.7,w:W-F*5,h:H-F*5,vmin:.48,vmax:3.65,pmin:.25,pmax:1.28};axes();
    withClip(()=>{
      fillArea(r.vl,r.vm,state.p,.90,'rgba(20,155,179,.27)');fillArea(r.vm,r.vg,state.p,.90,'rgba(225,154,43,.32)');curve(.90,colors.ink,4);
      line(X(plot.vmin),Y(state.p),X(plot.vmax),Y(state.p),colors.blue,3.5,[12,6]);
    });
    point(r.vl,state.p,'F',-26,-25);point(r.vm,state.p,'D',10,27);point(r.vg,state.p,'B',10,-25);
    const sp=spinodals(.90);point(sp.vl,sp.pmin,'E',-25,28);point(sp.vg,sp.pmax,'C',12,-24);
    const a1x=X((r.vl+r.vm)/2),a1y=Y((state.p+pressure((r.vl+r.vm)/2,.90))/2);
    const a2x=X((r.vm+r.vg)/2),a2y=Y((state.p+pressure((r.vm+r.vg)/2,.90))/2);
    text('A₁',a1x,a1y,colors.teal,F*1.1,'center',750);text('A₂',a2x,a2y,colors.orange,F*1.1,'center',750);
    text('水平候选压强 p₀',X(2.9),Y(state.p)-F*1.1,colors.blue,F*.9,'center',600);
  }
  function drawMeta(){
    const m=model,vsL=m.vsLiquid,vsG=m.vsGas;
    headerReadout([['θ = 0.90',colors.ink],['蓝：稳定单相',colors.blue],['紫：亚稳',colors.purple],['红：机械不稳定',colors.red]]);
    plot={x:F*3.5,y:F*2.65,w:W-F*5,h:H-F*5.1,vmin:.48,vmax:3.65,pmin:.20,pmax:1.4};axes();
    withClip(()=>{
      ctx.fillStyle='rgba(127,78,166,.08)';ctx.fillRect(X(m.vl),plot.y,X(vsL)-X(m.vl),plot.h);ctx.fillRect(X(vsG),plot.y,X(m.vg)-X(vsG),plot.h);
      ctx.fillStyle='rgba(205,58,72,.07)';ctx.fillRect(X(vsL),plot.y,X(vsG)-X(vsL),plot.h);
      curve(.90,colors.blue,4,plot.vmin,m.vl);curve(.90,colors.blue,4,m.vg,plot.vmax);
      curve(.90,colors.purple,state.focus==='liquid'?8:4.5,m.vl,vsL);curve(.90,colors.purple,state.focus==='gas'?8:4.5,vsG,m.vg);
      curve(.90,colors.red,state.focus==='unstable'?7:4,vsL,vsG,[9,7]);
      line(X(m.vl),Y(m.ps),X(m.vg),Y(m.ps),'#7998aa',2.8,[11,7]);
    });
    point(m.vg+.65,pressure(m.vg+.65,.90),'A',10,25,colors.blue);
    point(m.vg,m.ps,'B',13,27,colors.blue);
    point(vsG,pressure(vsG,.90),'C',10,-29,colors.red);
    point(m.vm,m.ps,'D',10,26,colors.ink);
    point(vsL,pressure(vsL,.90),'E',-28,31,colors.red);
    point(m.vl,m.ps,'F',-25,29,colors.blue);
    const gv=m.vl-.045;point(gv,pressure(gv,.90),'G',-31,-20,colors.blue);
    const gmid=(vsG+m.vg)/2,lmid=(vsL+m.vl)/2,umid=(vsL+vsG)/2;
    callout('B–C：过冷气体',X(2.40),plot.y+F*.55,X(gmid),Y(pressure(gmid,.90)),colors.purple);
    callout('F–E：过热液体',X(1.03),plot.y+F*.55,X(lmid),Y(pressure(lmid,.90)),colors.purple);
    callout('E–C：∂p/∂v > 0',X(1.48),plot.y+plot.h-F*.6,X(umid),Y(pressure(umid,.90)),colors.red);
    text('平衡共存线 F–B',X(2.4),Y(m.ps)+F*1.5,colors.muted,F*.95,'center',650);
  }
  function draw(){
    if(!W||!H)return;ctx.clearRect(0,0,W,H);
    if(mode==='andrews')drawAndrews();else if(mode==='family')drawFamily();else if(mode==='maxwell')drawMaxwell();else drawMeta();
  }
  function setup(){
    $('title').textContent=titles[mode];const input=$('parameter');
    if(mode==='andrews'){$('slider-label').textContent='摩尔体积 v';input.min=volumeEnd();input.max=3.3;input.step=.001;$('special-button').hidden=true}
    else if(mode==='family'){$('slider-label').textContent='约化温度 θ';input.min=.85;input.max=1.15;input.step=.001;$('special-button').textContent='临界 θ = 1';$('special-button').onclick=()=>manual(critical)}
    else if(mode==='maxwell'){const [lo,hi]=pressureBounds();$('slider-label').textContent='候选压强 p₀';input.min=lo;input.max=hi;input.step=.0001;$('special-button').textContent='等面积';$('special-button').onclick=()=>manual(equalize)}
    else{$('slider-label').hidden=true;input.hidden=true;$('parameter-value').hidden=true;$('special-button').hidden=true;$('demo-button').hidden=true;$('focus-controls').style.display='flex';document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>manual(()=>setState({focus:b.dataset.focus})))}
    input.addEventListener('input',()=>manual(()=>setState(mode==='andrews'?{v:+input.value}:mode==='family'?{theta:+input.value}:{p:+input.value})));
    $('demo-button').onclick=()=>manual(()=>demo());$('reset-button').onclick=()=>manual(reset);
    window.addEventListener('message',event=>{
      if(event.source!==window.parent&&event.source!==window)return;
      const data=event.data;if(!data||typeof data!=='object')return;
      if(data.type==='lecture-state'){lectureState(data);return}
      manualOverride=true;
      if(data.type==='demo')demo(data.durationMs);
      else if(data.type==='reset')reset();
      else if(data.type==='equalize'&&mode==='maxwell')equalize();
      else if(data.type==='critical'&&mode==='family')critical();
      else if(data.type==='set-state')setState(data.state||{});
      else if(data.type==='seek'&&Number.isFinite(data.progress)){cancel();setState(valuesAtProgress(data.progress))}
      else if(data.type==='gas'&&mode==='meta')setState({focus:'gas'});
      else if(data.type==='liquid'&&mode==='meta')setState({focus:'liquid'});
      else if(data.type==='unstable'&&mode==='meta')setState({focus:'unstable'});
    });
    window.phaseSim={getState,setState,reset,demo,seek:q=>setState(valuesAtProgress(q)),equalize,critical,lectureState,
      getTimelineState:()=>({lastLecture:lastLecture?{...lastLecture}:null,manualOverride}),
      math:{pressure,derivative,primitive,integral,spinodals,rootsAt,areas,maxwell},version:'sp7-phase-2-timeline'};
    window.addEventListener('resize',()=>{resize();draw()});resize();reset();
  }
  setup();
})();
</script>
</body>
