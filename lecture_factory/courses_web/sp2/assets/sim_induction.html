<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电磁感应实验台 · sp2</title>
<style>
:root{--ink:#16283f;--blue:#244b88;--red:#bb3434;--muted:#61758e;--line:#d9e3f0}*{box-sizing:border-box}body{margin:0;background:#f8fbff;color:var(--ink);font:26px/1.45 "PingFang SC","Microsoft YaHei",sans-serif}header{padding:15px 25px;font-weight:700;color:var(--blue)}body.embed header{display:none}.lab{display:grid;grid-template-columns:310px minmax(0,1fr) 430px;gap:15px;padding:14px;min-height:650px}.panel,.stage,.charts{border:1px solid var(--line);border-radius:15px;background:#fff;padding:18px}h2{font-size:27px;margin:0 0 14px;color:var(--blue)}button{font:24px/1.4 inherit;border:1px solid #8da8cf;border-radius:9px;padding:9px 15px;background:#eef4fc;color:var(--blue);cursor:pointer;margin:4px}button.active{background:var(--blue);color:#fff}label{display:block;margin:16px 0 5px;font-size:23px}input{width:100%;accent-color:var(--blue)}.note{font-size:20px;color:var(--muted);border-top:1px solid var(--line);padding-top:15px;margin-top:18px}output{font-weight:700;color:var(--blue)}.stage svg{display:block;width:100%;height:405px}.stats{display:grid;grid-template-columns:1fr;gap:8px;font-size:25px}.stats b{font-variant-numeric:tabular-nums;color:var(--blue)}canvas{display:block;width:100%;height:215px}.chartlabel{font-size:24px;color:var(--blue);margin:8px 0}.status{font-size:23px;color:var(--red);min-height:40px}body.tube .fieldctl{display:none}body:not(.tube) .tubectl{display:none}@media(max-width:1100px){.lab{grid-template-columns:240px 1fr 310px}body{font-size:21px}.stage svg{height:350px}canvas{height:180px}h2{font-size:23px}button{font-size:20px}}@media(max-width:740px){.lab{grid-template-columns:1fr}.stage svg{height:340px}.charts{display:grid;grid-template-columns:1fr 1fr}.panel{display:flex;flex-wrap:wrap;gap:8px}.panel h2,.panel .note{width:100%}}
</style></head><body><header>电磁感应实验台 · 本地交互模拟</header>
<main class="lab"><section class="panel"><h2 id="heading">操作台</h2>
<div class="fieldctl"><button id="switch">闭合开关</button><label>励磁稳态电流 <output id="ampout">3.0 A</output></label><input id="amp" type="range" min="1" max="5" step="0.1" value="3"><label>感应回路电阻 <output id="rout">5.0 Ω</output></label><input id="resistance" type="range" min="2" max="15" step="0.5" value="5"></div>
<div class="tubectl"><button data-material="copper" class="active">完整铜管</button><button data-material="plastic">塑料管</button><button data-material="slit">开缝铜管</button><button id="release">释放磁铁</button></div>
<button id="demo">重播演示</button><button id="reset">复位</button><button id="pause">暂停</button>
<p class="note" id="modelnote">模拟将开关过程展开为短时间过渡。励磁回路与感应回路彼此绝缘。感应线圈按等效单匝建模，Φ=cI，c=0.6 Wb/A。</p></section>
<section class="stage"><h2 id="stageTitle">变化磁场与感应电动势</h2><svg id="scene" viewBox="0 0 840 460" aria-label="实验示意"></svg><div class="status" id="status">准备就绪</div><div class="stats" id="stats"></div></section>
<section class="charts"><div><div class="chartlabel" id="label1">磁通量 Φ / Wb</div><canvas id="plot1" width="640" height="300"></canvas></div><div><div class="chartlabel" id="label2">感应电动势 ε / V</div><canvas id="plot2" width="640" height="300"></canvas></div></section></main>
<script>
'use strict';
// Reauthored compact embed from the local induction laboratory supplied with the source.
// Analytic states are recalculated from the course audio clock, including every seek.
const q=new URLSearchParams(location.search),mode=q.get('mode')||'field',pageId=+(q.get('page')||5);
document.body.classList.toggle('embed',q.has('embed'));document.body.classList.toggle('tube',mode==='tube');
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
let anchor=null,lessonOff=6,fieldOff=6,amp=3,R=5,material='copper',manual=true,running=false,paused=false,manualStart=0,held=0,lastParent=null,timeline=null;
// The opt-in protocol uses page-relative times. Once received, it takes precedence
// over the legacy absolute audio anchor, including a fetch that completes later.
fetch('weblec.json').then(r=>r.json()).then(d=>{if(timeline)return;const pg=d.slides.find(p=>p.id===pageId);anchor=pg?.stepTimes?.['2']??null;const off=pg?.stepTimes?.['3'];if(mode==='field'&&Number.isFinite(anchor)&&Number.isFinite(off)&&off>anchor)lessonOff=off-anchor;manual=false}).catch(()=>{});
function extent(){return mode==='field'?Math.max(14,fieldOff+8):14}
function active(){return manual?running:timeline?timeline.step>=2&&timeline.pageTime>=timeline.start:anchor!==null&&lastParent>=anchor}
function defaults(){amp=3;R=5;material='copper';running=false;paused=false;held=0;$('amp').value=3;$('resistance').value=5;$('pause').textContent='暂停';sync()}
function clock(){
 // Do not interpolate with wall time or guess the lecture playback rate. A paused
 // or static message remains an exact snapshot until the parent sends a new one.
 if(timeline){if(!manual){fieldOff=timeline.off;return Math.max(0,Math.min(extent(),timeline.pageTime-timeline.start))}return !running?0:paused?held:Math.min(extent(),(performance.now()-manualStart)/1000)}
 let a=null;try{a=parent.document.querySelector('audio')}catch(_){}
 if(a&&anchor!==null){const now=a.currentTime;if(lastParent!==null&&Math.abs(now-lastParent)>.25){amp=3;R=5;material='copper';$('amp').value=3;$('resistance').value=5;sync();manual=false;}if(!a.paused)manual=false;lastParent=now;if(!manual){fieldOff=lessonOff;return Math.max(0,Math.min(extent(),now-anchor));}}
 return !running?0:paused?held:Math.min(extent(),(performance.now()-manualStart)/1000);
}
function restart(){fieldOff=6;manual=true;running=true;paused=false;manualStart=performance.now();held=0;$('pause').textContent='暂停';render(0)}
function reset(){fieldOff=6;manual=true;lastParent=null;defaults();render(0)}
function sync(){$('ampout').textContent=amp.toFixed(1)+' A';$('rout').textContent=R.toFixed(1)+' Ω';document.querySelectorAll('[data-material]').forEach(b=>b.classList.toggle('active',b.dataset.material===material));}
$('demo').onclick=restart;$('release').onclick=restart;$('reset').onclick=reset;
$('pause').onclick=()=>{if(!manual){held=clock();manual=true;running=true;paused=true}else if(paused){manualStart=performance.now()-held*1000;paused=false}else{held=clock();paused=true} $('pause').textContent=paused?'继续':'暂停'};
$('switch').onclick=()=>{const t=clock();if(!active()||!field(t).on){restart();return}fieldOff=t;manual=true;manualStart=performance.now()-t*1000;held=t;running=true;paused=false;$('pause').textContent='暂停';render(t)};
$('amp').oninput=e=>{amp=+e.target.value;sync();restart()};$('resistance').oninput=e=>{const t=clock();if(timeline&&!manual){running=active();manual=true;paused=true;held=t;$('pause').textContent='继续'}R=+e.target.value;sync();render(t)};
document.querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>{material=b.dataset.material;running=false;manual=true;held=0;sync();render(0)});
window.addEventListener('message',e=>{
 if(e.source!==parent)return;
 const d=e.data;
 if(d?.type==='lecture-state'){
  if(!location.origin||location.origin==='null'||e.origin!==location.origin||d.pageId!==pageId||!['interactive','static'].includes(d.mode)||typeof d.playing!=='boolean'||!Number.isFinite(d.pageTime)||d.pageTime<0||!Number.isInteger(d.step)||d.step<0||!d.steps||typeof d.steps!=='object'||Array.isArray(d.steps))return;
  const start=d.steps['2'],off=d.steps['3'];
  if(!Number.isFinite(start)||start<0||(mode==='field'&&(!Number.isFinite(off)||off<=start)))return;
  const next={mode:d.mode,pageTime:d.pageTime,step:d.step,playing:d.mode==='interactive'&&d.playing,start,off:mode==='field'?off-start:6};
  const changed=!timeline||next.mode!==timeline.mode||next.pageTime!==timeline.pageTime||next.step!==timeline.step||next.start!==timeline.start||next.off!==timeline.off||next.playing!==timeline.playing;
  // Identical paused/static notifications preserve a user's manual experiment.
  // Resume, seek, or a different step re-establishes the default classroom model.
  timeline=next;
  if(changed||next.playing){defaults();manual=false;fieldOff=next.off}
  render(clock());return;
 }
 if(timeline)return;
 if(d?.type==='reset'){reset();manual=false;render(0)}
 if(d?.type==='demo'){if(anchor===null)restart();else{manual=false;render(clock())}}
});
function field(t){const tau=.65,M=.6,on=t>=0&&t<fieldOff,I=on?amp*(1-Math.exp(-t/tau)):amp*(1-Math.exp(-fieldOff/tau))*Math.exp(-(t-fieldOff)/tau);const d=on?amp/tau*Math.exp(-t/tau):-I/tau;return{phi:M*I,eps:-M*d,I,on};}
const mass=.02,g=9.8,H=1.8,slow=.32;
function falling(t){const k=material==='copper'?.15:0,tt=t*slow;let y,v,time=tt;if(k){v=mass*g/k*(1-Math.exp(-k*tt/mass));y=mass*g/k*(tt-mass/k*(1-Math.exp(-k*tt/mass)))}else{v=g*tt;y=.5*g*tt*tt}if(y>H){let lo=0,hi=tt;for(let i=0;i<35;i++){const m=(lo+hi)/2,yy=k?mass*g/k*(m-mass/k*(1-Math.exp(-k*m/mass))):.5*g*m*m;if(yy>H)hi=m;else lo=m}const stop=(lo+hi)/2;time=stop;v=k?mass*g/k*(1-Math.exp(-k*stop/mass)):g*stop;y=H}const Q=Math.max(0,mass*g*y-.5*mass*v*v);return{y,v,Q,k,F:k*v,t:time};}
function plot(canvas,t,fn,min,max,label,color){const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height;c.clearRect(0,0,w,h);c.fillStyle='#fff';c.fillRect(0,0,w,h);const l=74,b=45,top=25,cw=w-l-20,ch=h-top-b;const Y=v=>top+(max-v)/(max-min)*ch;c.strokeStyle='#dce6f2';c.lineWidth=1;for(let j=0;j<=4;j++){const v=min+(max-min)*j/4,y=Y(v);c.beginPath();c.moveTo(l,y);c.lineTo(w-20,y);c.stroke();c.fillStyle='#61758e';c.font='22px sans-serif';c.fillText(v.toFixed(2),4,y+8)}c.strokeStyle='#778ba6';c.beginPath();c.moveTo(l,top);c.lineTo(l,h-b);c.lineTo(w-20,h-b);c.stroke();c.fillStyle='#61758e';c.font='23px sans-serif';c.fillText('0',l,h-12);c.fillText(mode==='tube'?'4.48':extent().toFixed(1),w-64,h-12);c.fillText('t / s',w/2,h-10);c.strokeStyle=color;c.lineWidth=4;c.beginPath();for(let j=0;j<=200;j++){const u=t*j/200,x=l+u/extent()*cw,y=Y(fn(u));j?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();}
function arrow(x,y,xx,yy,color='#244b88'){return `<path d="M${x},${y}L${xx},${yy}" fill="none" stroke="${color}" stroke-width="5" marker-end="url(#arr)"/>`}
const defs='<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="context-stroke"/></marker><linearGradient id="cu"><stop stop-color="#96522b"/><stop offset=".5" stop-color="#e8b075"/><stop offset="1" stop-color="#96522b"/></linearGradient></defs>';
function render(t){
 const zero=!active()||(mode==='tube'&&t===0);
 if(mode==='tube'){
  const s=falling(zero?0:t),yy=60+s.y/H*310,name={copper:'完整铜管',plastic:'塑料管',slit:'开缝铜管'}[material];
  $('heading').textContent='管材对照';$('stageTitle').textContent=name+'中的下落';$('label1').textContent='速度 v / (m/s)';$('label2').textContent='焦耳热 Q / J';$('modelnote').textContent='低速示意模型：m dv/dt = mg − kv。0.32倍慢放。完整铜管 k=0.15 kg/s；开缝理想化为 k=0，真实管内仍可能有局部涡流。';
  $('scene').innerHTML=defs+`<rect x="300" y="70" width="180" height="340" rx="18" fill="${material==='plastic'?'#c9dfed':'url(#cu)'}" opacity=".65" stroke="#8b6743" stroke-width="4"/><ellipse cx="390" cy="70" rx="90" ry="23" fill="#edf3fa" stroke="#8b6743" stroke-width="5"/>`+(material==='slit'?'<path d="M390 80V410" stroke="#fff" stroke-width="12"/>':'')+`<rect x="355" y="${yy}" width="70" height="90" rx="8" fill="#244b88"/><rect x="355" y="${yy+45}" width="70" height="45" rx="4" fill="#bb3434"/><text x="390" y="${yy+30}" fill="white" font-size="26" text-anchor="middle">S</text><text x="390" y="${yy+78}" fill="white" font-size="26" text-anchor="middle">N</text>`+arrow(555,yy+15,555,yy+85)+(s.k&&s.y<H&&s.y>0?arrow(220,yy+85,220,yy+5,'#bb3434'):'')+`<text x="590" y="${yy+60}" font-size="28" fill="#244b88">速度向下</text><text x="90" y="32" font-size="27" fill="#bb3434">完整铜管的电磁阻力向上</text>`;
  $('status').textContent=zero?'选好管材后释放磁铁':s.y>=H?'到达模型观察区底端':'下落中（慢放）';
  $('stats').innerHTML=`<span>模型时间 <b>${s.t.toFixed(2)} s</b>　下落高度 <b>${s.y.toFixed(2)} m</b></span><span>速度 <b>${s.v.toFixed(2)} m/s</b>　阻力 <b>${s.F.toFixed(3)} N</b></span><span>焦耳热 <b>${s.Q.toFixed(3)} J</b></span>`;
  plot($('plot1'),zero?0:Math.min(t,s.t/slow),u=>falling(u).v,0,material==='copper'?1.5:6,'v','#244b88');plot($('plot2'),zero?0:Math.min(t,s.t/slow),u=>falling(u).Q,0,.4,'Q','#bb3434');
 }else{
  const s=field(t);if(zero){s.I=0;s.phi=0;s.eps=0;s.on=false}
  const angle=Math.max(-55,Math.min(55,s.eps/R*130));
  $('switch').textContent=s.on?'断开开关':'闭合开关';$('status').textContent=zero?'等待闭合开关':t<2?'接通：磁通量增加':t<fieldOff?'保持：电动势趋近零':t<fieldOff+2?'断开：磁通量减少':'磁通量与电动势回到零';
  $('scene').innerHTML=defs+'<path d="M80 270V350H290V275 M455 275V350H690V275" fill="none" stroke="#536d8e" stroke-width="5"/><rect x="125" y="335" width="75" height="30" rx="5" fill="#bad4eb"/><text x="130" y="410" font-size="27">励磁电源</text><text x="145" y="40" font-size="29" fill="#244b88">励磁回路</text><text x="530" y="40" font-size="29" fill="#bb3434">感应回路</text>'+Array.from({length:7},(_,i)=>`<ellipse cx="${110+i*23}" cy="210" rx="28" ry="90" fill="none" stroke="#5788cd" stroke-width="8"/>`).join('')+Array.from({length:5},(_,i)=>`<ellipse cx="${425+i*18}" cy="210" rx="25" ry="78" fill="none" stroke="#b17b48" stroke-width="7"/>`).join('')+(s.I>.02?arrow(240,210,465,210):'')+`<circle cx="660" cy="230" r="90" fill="#f7faff" stroke="#536d8e" stroke-width="4"/><path d="M598 185Q660 140 724 185" fill="none" stroke="#8aa2c1" stroke-width="4"/><text x="650" y="165" font-size="23">0</text><path d="M660 245V165" stroke="#bb3434" stroke-width="6" transform="rotate(${angle} 660 245)"/><text x="600" y="270" font-size="25">检流计</text>`;
  $('stats').innerHTML=`<span>励磁电流 <b>${s.I.toFixed(3)} A</b>　磁通量 Φ <b>${s.phi.toFixed(3)} Wb</b></span><span>感应电动势 <b>${s.eps.toFixed(3)} V</b>　感应电流 <b>${(s.eps/R).toFixed(3)} A</b></span>`;
  plot($('plot1'),zero?0:t,u=>field(u).phi,0,3.2,'Φ','#244b88');plot($('plot2'),zero?0:t,u=>field(u).eps,-5,5,'ε','#bb3434');
 }
 window.sp2State={mode,time:t,material,manual,anchor,fieldOff,amp,R,active:active(),timelineMode:timeline?.mode??null,pageTime:timeline?.pageTime??null,step:timeline?.step??null,playing:timeline?.playing??false,stats:$('stats').textContent};
}
function loop(){render(clock());requestAnimationFrame(loop)}sync();render(0);requestAnimationFrame(loop);
</script></body></html>
