  function makeUnit(section, unit) {
    return {
      name: unit[1], short: unit[2], code: unit[0], type: 'unit', cat: section.cat,
      featured: !!unit[4], hours: unitHours[unit[0]] || 2, href: lessonLinks[unit[0]],
      children: unit[3].map(concept => ({ name: concept, type: 'concept', cat: section.cat }))
    };
  }

  function buildGroup(section, spec, byCode) {
    const children = spec.children
      ? spec.children.map(child => buildGroup(section, child, byCode))
      : spec.codes.map(code => makeUnit(section, byCode.get(code)));
    return {name: spec.name, short: spec.name, type: 'group', cat: section.cat, children};
  }

  const treeData = {
    name: '大学物理', type: 'root',
    children: sections.map(section => {
      const byCode = new Map(section.units.map(unit => [unit[0],unit]));
      return {
        name: section.name, short: section.short, type: 'module', cat: section.cat,
        hours: section.hours, unitCount: section.units.length, desc: section.desc,
        children: groupedModules[section.cat]
          ? groupedModules[section.cat].map(spec => buildGroup(section, spec, byCode))
          : section.units.map(unit => makeUnit(section, unit))
      };
    })
  };

  function installZoom(viewport) {

  function zoomBy(factor) {
    if (!zoomBehavior) return;
    svg.transition().duration(160).call(zoomBehavior.scaleBy, factor);

  function resetZoom() {
    if (!zoomBehavior) return;
    svg.transition().duration(180).call(zoomBehavior.transform, d3.zoomIdentity);
  }

  function openLessonForNode(event, node) {
    if (event) event.stopPropagation();
    const unitNode = node.data.type === 'unit' ? node : node.ancestors().find(item => item.data.type === 'unit');
    if (unitNode && unitNode.data.href) location.href = unitNode.data.href;
  }

  function topCat(d) {
    if (d.depth === 0) return -1;
    let n = d;
    while (n.depth > 1) n = n.parent;
    return n.data.cat;
  }

  function radialPoint(angle, radius) {
    return [Math.sin(angle) * radius, -Math.cos(angle) * radius];
  }

  function nodeDescription(d) {
    if (d.data.type === 'root') return '64学时 · 16周 · 41个教学单元 · 9个青教赛重点节段';
    if (d.data.type === 'module') return `${d.data.hours}学时 · ${d.data.unitCount}个教学单元。${d.data.desc}`;
    if (d.data.type === 'group') {
      const count = d.descendants().filter(node => node.data.type === 'unit').length;
      return `知识分区 · ${count}个教学单元`;
    }
    if (d.data.type === 'unit') return `${d.data.hours}学时${d.data.featured ? ' · 青教赛重点节段' : ''}。核心概念：${d.children.map(x => x.data.name).join('；')}`;
    const unit = d.ancestors().find(node => node.data.type === 'unit');
    return unit ? `核心概念 · 所属单元：${unit.data.name}` : '课程知识点';
  }

  function countMindNodes(nodes) {
    return nodes.reduce((sum, node) => sum + 1 + countMindNodes(node.children || []), 0);
  }

  function setSelection(d) {
    if (d.data.type === 'root') titleEl.textContent = '大学物理';
    else if (d.data.type === 'module') {
      activeCat = String(d.data.cat);
      titleEl.textContent = d.data.name;
      textEl.textContent = nodeDescription(d);
      lastWidth = 0;
      draw();
      return;
    }
    else if (d.data.type === 'unit') {
      detailCode = d.data.code;
      filtersEl.hidden = true;
      backEl.hidden = false;
      titleEl.textContent = d.data.name;
      const branchCount = (mindMaps[d.data.code] || []).length;
      const pointCount = countMindNodes(mindMaps[d.data.code] || []) - branchCount;
      textEl.textContent = `${d.data.hours}学时${d.data.featured ? ' · 青教赛重点节段' : ''} · ${branchCount}条知识主线 · ${pointCount}个展开要点`;
      lastWidth = 0;
      draw();
      return;
    }
    else titleEl.textContent = d.data.name;
    textEl.textContent = nodeDescription(d);
  }

      btn.classList.toggle('btn-ghost', !selected);
    });
    svg.selectAll('[data-category]').classed('kg-dim', function() {
      const category = this.getAttribute('data-category');
      return activeCat !== 'all' && category !== 'root' && category !== activeCat;

  function wrapMindLabel(value, maxChars) {
    const chars = Array.from(value);
    const lines = [];
    for (let i = 0; i < chars.length; i += maxChars) lines.push(chars.slice(i, i + maxChars).join(''));
    return lines;
  }

  function renderCourseMap(width) {
    const virtualWidth = 1800;
    const virtualHeight = 1600;
    const centerX = virtualWidth / 2;
    const centerY = virtualHeight / 2;
    const radius = 570;
    const displayHeight = Math.max(520, Math.round(width * virtualHeight / virtualWidth));
    const hierarchy = d3.hierarchy(treeData);
    d3.cluster().size([Math.PI * 2,radius])(hierarchy);
    hierarchy.descendants().forEach(node => {
      if (node.data.type === 'module') node.y = 190;
      else if (node.data.type === 'group') node.y = node.depth === 2 ? 255 : 325;
      else if (node.data.type === 'unit') node.y = node.depth === 3 ? 390 : 440;
      else if (node.data.type === 'concept') node.y = 570;
    });

    svg.attr('viewBox',`0 0 ${virtualWidth} ${virtualHeight}`).attr('height',displayHeight);
    const viewport = svg.append('g').attr('class','kg-viewport');
    const chart = viewport.append('g').attr('transform',`translate(${centerX},${centerY})`);
    const radial = d3.linkRadial().angle(d => d.x).radius(d => d.y);

    chart.append('g').selectAll('path').data(hierarchy.links()).join('path')
      .attr('class',d => `kg-course-link cat-${topCat(d.target)}`)
      .attr('stroke-width',d => d.target.data.type === 'module' ? 6.5 : d.target.data.type === 'group' ? 4.2 : d.target.data.type === 'unit' ? 3 : 2)
      .attr('d',radial);

    const rootNode = chart.append('g').attr('class','kg-course-root');
    rootNode.append('rect').attr('x',-104).attr('y',-43).attr('width',208).attr('height',86).attr('rx',18);
    rootNode.append('text').attr('class','title').attr('y',-5).text('大学物理');
    rootNode.append('text').attr('class','sub').attr('y',22).text('64学时 · 16周');

    const visibleNodes = hierarchy.descendants().filter(d => d.depth > 0 && d.data.type !== 'concept');
    const nodes = chart.append('g').selectAll('g').data(visibleNodes).join('g')
      .attr('class',d => `kg-course-node kg-node cat-${topCat(d)} ${d.data.type}`)
      .attr('transform',d => {
        const p = radialPoint(d.x,d.y);
        return `translate(${p[0]},${p[1]})`;
      })
      .on('click',(event,d) => { event.stopPropagation(); setSelection(d); });

    nodes.filter(d => d.data.type === 'module').append('rect')
      .attr('x',d => -(Math.max(96,Array.from(d.data.name).length * 22 + 38) / 2))
      .attr('y',-20)
      .attr('width',d => Math.max(96,Array.from(d.data.name).length * 22 + 38))
      .attr('height',40)
      .attr('rx',10);

    nodes.filter(d => d.data.type !== 'module').append('circle').attr('class','main')
      .attr('r',d => d.data.type === 'group' ? 12 : 8.5);

    nodes.filter(d => d.data.featured).append('circle').attr('class','kg-focus-ring').attr('r',14.5);

    nodes.filter(d => d.data.type === 'module').append('text')
      .attr('class','kg-course-label module')
      .attr('text-anchor','middle')
      .attr('dy','.34em')
      .text(d => d.data.name);

    const groupLabels = nodes.filter(d => d.data.type === 'group').append('text')
      .attr('class','kg-course-label group')
      .attr('x',d => d.x < Math.PI ? 14 : -14)
      .attr('text-anchor',d => d.x < Math.PI ? 'start' : 'end')
      .attr('transform',d => {
        const offset = d.data.name === '麦克斯韦方程组'
          ? 24
          : d.data.name === '物态与相变' ? 36 : 0;
        return offset ? `translate(${Math.sin(d.x) * offset},${-Math.cos(d.x) * offset})` : null;
      })
      .attr('dy','.34em');

    groupLabels.each(function(d) {
      const chars = Array.from(d.data.name);
      const splitAt = Math.ceil(chars.length / 2);
      const lines = chars.length > 4
        ? [chars.slice(0,splitAt).join(''),chars.slice(splitAt).join('')]
        : [d.data.name];
      const x = d.x < Math.PI ? 14 : -14;
      const label = d3.select(this);
      lines.forEach((line,index) => label.append('tspan')
        .attr('x',x)
        .attr('dy',index === 0 ? (lines.length === 1 ? '.34em' : '-.26em') : '1.08em')
        .text(line));
    });

    const conceptNodes = hierarchy.descendants().filter(d => d.data.type === 'concept');
    const conceptGroups = chart.append('g').selectAll('g').data(conceptNodes).join('g')
      .attr('class',d => `kg-course-node cat-${topCat(d)}`)
      .attr('transform',d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`)
      .on('click',(event,d) => openLessonForNode(event,d));

    conceptGroups.append('circle')
      .attr('r',6)
      .attr('fill',d => `var(--viz-series-${topCat(d) + 1})`);

    conceptGroups.append('text')
      .attr('class','kg-course-label concept kg-direct-link')
      .attr('x',d => d.x < Math.PI ? 12 : -12)
      .attr('dy','.34em')
      .attr('text-anchor',d => d.x < Math.PI ? 'start' : 'end')
      .attr('transform',d => d.x >= Math.PI ? 'rotate(180)' : null)
      .text(d => d.data.name);

    // The penultimate-ring labels are added last so outer nodes and branches
    // never cover them. Unit codes and titles use separate lines to stay within the ring.
    const unitLabels = chart.append('g').attr('class','kg-label-layer')
      .selectAll('text')
      .data(visibleNodes.filter(d => d.data.type === 'unit'))
      .join('text')
      .attr('class','kg-course-label unit kg-direct-link')
      .attr('text-anchor',d => d.x < Math.PI ? 'start' : 'end')
      .attr('transform',d => {
        const p = radialPoint(d.x,d.y);
        return `translate(${p[0]},${p[1]}) rotate(${d.x * 180 / Math.PI - 90})${d.x >= Math.PI ? ' rotate(180)' : ''}`;
      })
      .on('click',(event,d) => openLessonForNode(event,d));

    unitLabels.each(function(d) {
      const lines = wrapMindLabel(d.data.short,8);
      const x = d.x < Math.PI ? 18 : -18;
      const label = d3.select(this);
      lines.forEach((line,index) => label.append('tspan')
        .attr('x',x)
        .attr('dy',index === 0 ? `${-.52 * (lines.length - 1)}em` : '1.08em')
        .text(line));
    });

    installZoom(viewport);
    svg.on('click',() => setSelection(hierarchy));
    applyFilter();
  }

  function renderModuleMap(width) {
    const moduleData = treeData.children.find(section => String(section.cat) === activeCat);
    if (!moduleData) return;

    function copyForModule(node) {
      return {
        ...node,
        children: (node.children || []).filter(child => child.type !== 'concept').map(copyForModule)
      };
    }

    const hierarchy = d3.hierarchy(copyForModule(moduleData));
    const unitCount = hierarchy.descendants().filter(node => node.data.type === 'unit').length;
    const rowGap = width < 520 ? 144 : 74;
    const mapHeight = Math.max(620, unitCount * rowGap + 100);
    const left = width < 520 ? 22 : 34;
    const rightReserve = width < 520 ? 128 : 260;
    const usableWidth = Math.max(190, width - left - rightReserve);
    d3.tree().size([mapHeight - 100, usableWidth])(hierarchy);

    svg.attr('viewBox',`0 0 ${width} ${mapHeight}`).attr('height',mapHeight);
    const viewport = svg.append('g').attr('class','kg-viewport');
    const chart = viewport.append('g').attr('transform',`translate(${left},50)`);

    chart.append('g').selectAll('path').data(hierarchy.links()).join('path')
      .attr('class',`kg-mind-link cat-${moduleData.cat}`)
      .attr('d',d3.linkHorizontal().x(d => d.y).y(d => d.x));

    const nodes = chart.append('g').selectAll('g').data(hierarchy.descendants()).join('g')
      .attr('class',d => `kg-node cat-${moduleData.cat} ${d.data.type} ${d.depth === 0 ? 'root' : ''}`)
      .attr('transform',d => `translate(${d.y},${d.x})`)
      .on('click',(event,d) => { event.stopPropagation(); setSelection(d); });

    nodes.filter(d => d.data.featured).append('circle').attr('class','kg-focus-ring').attr('r',12.5);
    nodes.append('circle').attr('class','main')
      .attr('r',d => d.depth === 0 ? 14 : d.data.type === 'group' ? 9 : 7)
      .attr('data-tooltip',d => d.data.name);

    const columnChars = width < 520
      ? 4
      : Math.max(6, Math.min(13, Math.floor((usableWidth / Math.max(1,hierarchy.height)) / 14)));
    nodes.each(function(d) {
      const value = d.data.type === 'module'
        ? `${d.data.name}　${d.data.hours}学时`
        : d.data.name;
      const lines = wrapMindLabel(value,columnChars);
      const label = d3.select(this).append('text')
        .attr('class',`kg-tree-label ${d.data.type === 'module' ? 'root' : d.data.type}${d.data.type === 'unit' ? ' kg-direct-link' : ''}`)
        .attr('x',13)
        .attr('text-anchor','start');
      lines.forEach((line,index) => label.append('tspan')
        .attr('x',13)
        .attr('dy',index === 0 ? `${-.52 * (lines.length - 1)}em` : '1.08em')
        .text(line));
      if (d.data.type === 'unit') label.on('click',(event) => openLessonForNode(event,d));
    });

    installZoom(viewport);
  }

  function renderReadableMindMap(width, unit, hierarchy) {
    const leafCount = Math.max(1, hierarchy.leaves().length);
    const rowGap = width < 520 ? 76 : 50;
    const mapHeight = Math.max(620, leafCount * rowGap + 90);
    const left = width < 520 ? 22 : 32;
    const rightReserve = width < 520 ? 112 : 190;
    const usableWidth = Math.max(180, width - left - rightReserve);
    const innerHeight = mapHeight - 80;
    d3.tree().size([innerHeight, usableWidth])(hierarchy);

    svg.attr('viewBox', `0 0 ${width} ${mapHeight}`).attr('height', mapHeight);
    const viewport = svg.append('g').attr('class','kg-viewport');
    const chart = viewport.append('g').attr('transform',`translate(${left},40)`);

    chart.append('g').selectAll('path').data(hierarchy.links()).join('path')
      .attr('class',`kg-mind-link cat-${unit.cat}`)
      .attr('d',d3.linkHorizontal().x(d => d.y).y(d => d.x));

    const nodes = chart.append('g').selectAll('g').data(hierarchy.descendants()).join('g')
      .attr('class',d => `kg-node cat-${unit.cat} ${d.data.type} ${d.depth === 0 ? 'root' : ''}`)
      .attr('transform',d => `translate(${d.y},${d.x})`);

    nodes.append('circle').attr('class','main')
      .attr('r',d => d.depth === 0 ? 12 : d.depth === 1 ? 8 : d.children ? 6 : 5)
      .attr('data-tooltip',d => d.data.name);

    const maxChars = Math.max(5, Math.min(12, Math.floor((usableWidth / Math.max(1,hierarchy.height)) / 13)));
    nodes.each(function(d) {
      const value = d.depth === 0 ? unit.short : d.data.name;
      const lines = wrapMindLabel(value, d.depth === hierarchy.height ? Math.max(8,maxChars) : maxChars);
      const labelClass = d.depth === 1 ? 'branch' : d.children ? 'subbranch' : 'leaf';
      const label = d3.select(this).append('text')
        .attr('class',`kg-mind-label ${labelClass}${!d.children && d.depth > 0 ? ' kg-direct-link' : ''}`)
        .attr('x',11)
        .attr('text-anchor','start');
      lines.forEach((line,index) => label.append('tspan')
        .attr('x',11)
        .attr('dy',index === 0 ? `${-.52 * (lines.length - 1)}em` : '1.05em')
        .text(line));
      if (!d.children && d.depth > 0 && unit.href) {
        label.on('click',event => {
          event.stopPropagation();
          location.href = unit.href;
        });
      }
    });

    installZoom(viewport);
  }

  function renderMindMap(width, height) {
    const unitNode = d3.hierarchy(treeData).descendants().find(node => node.data.code === detailCode);
    const unit = unitNode && unitNode.data;
    if (!unit) return;
    const branches = mindMaps[detailCode] || [];
    function normalizeMindNode(node, depth = 1) {
      return {
        name: node.name,
        type: depth === 1 ? 'mind-branch' : 'mind-leaf',
        cat: unit.cat,
        children: (node.children || []).map(child => normalizeMindNode(child, depth + 1))
      };
    }
    const mapData = {
      name: unit.short, type: 'mind-root', cat: unit.cat,
      children: branches.map(branch => normalizeMindNode(branch))
    };
    const hierarchy = d3.hierarchy(mapData);
    renderReadableMindMap(width, unit, hierarchy);
    return;
    const compact = width < 520;
    const mapHeight = compact ? Math.max(720, hierarchy.leaves().length * 34) : height;
    svg.attr('viewBox', `0 0 ${width} ${mapHeight}`).attr('height', mapHeight);
    const viewport = svg.append('g').attr('class','kg-viewport');

    if (compact) {
      const leaves = hierarchy.leaves().length;
      d3.tree().size([Math.max(560, leaves * 34), Math.max(145, width - 165)])(hierarchy);
      const chart = viewport.append('g').attr('transform','translate(28,52)');
      chart.append('g').selectAll('path').data(hierarchy.links()).join('path')
        .attr('class',`kg-mind-link cat-${unit.cat}`)
        .attr('d',d3.linkHorizontal().x(d => d.y).y(d => d.x));
      const nodes = chart.append('g').selectAll('g').data(hierarchy.descendants()).join('g')
        .attr('class',d => `kg-node cat-${unit.cat} ${d.data.type}`)
        .attr('transform',d => `translate(${d.y},${d.x})`);
      nodes.append('circle').attr('class','main').attr('r',d => d.depth === 0 ? 9 : d.depth === 1 ? 6 : d.children ? 4.5 : 3.5);
      nodes.append('text').attr('class',d => `kg-mind-label ${d.depth === 1 ? 'branch' : 'leaf'}`)
        .attr('x',10).attr('dy','.32em').text(d => d.depth === 0 ? unit.short : d.data.name);
      const zoom = d3.zoom().scaleExtent([.8,4]).on('zoom',event => viewport.attr('transform',event.transform));
      svg.call(zoom).on('dblclick.zoom',null);
      return;
    }

    const radius = Math.max(210, Math.min(width,height) / 2 - 125);
    d3.cluster().size([Math.PI * 2,radius])(hierarchy);
    const chart = viewport.append('g').attr('transform',`translate(${width/2},${height/2})`);
    const radial = d3.linkRadial().angle(d => d.x).radius(d => d.y);
    chart.append('g').selectAll('path').data(hierarchy.links()).join('path')
      .attr('class',`kg-mind-link cat-${unit.cat}`).attr('d',radial);
    const nodes = chart.append('g').selectAll('g').data(hierarchy.descendants()).join('g')
      .attr('class',d => `kg-node cat-${unit.cat} ${d.data.type} ${d.depth === 0 ? 'root' : ''}`)
      .attr('transform',d => {
        const p = radialPoint(d.x,d.y);
        return `translate(${p[0]},${p[1]})`;
      });
    nodes.append('circle').attr('class','main')
      .attr('r',d => d.depth === 0 ? 50 : d.depth === 1 ? 7 : d.children ? 4.5 : 3.5)
      .attr('data-tooltip',d => d.data.name);
    const center = nodes.filter(d => d.depth === 0);
    center.append('text').attr('class','kg-center-label').attr('y',-5).text(unit.short);
    center.append('text').attr('class','kg-center-sub').attr('y',14).text('知识导图');

    nodes.filter(d => d.depth > 0).each(function(d) {
      const right = d.x < Math.PI;
      const maxChars = d.depth === 1 ? 8 : width < 900 ? 10 : 14;
      const lines = wrapMindLabel(d.data.name,maxChars);
      const label = d3.select(this).append('text')
        .attr('class',`kg-mind-label ${d.depth === 1 ? 'branch' : 'leaf'}`)
        .attr('x',right ? 10 : -10)
        .attr('text-anchor',right ? 'start' : 'end');
      lines.forEach((line,index) => label.append('tspan')
        .attr('x',right ? 10 : -10)
        .attr('dy',index === 0 ? `${-.52 * (lines.length - 1)}em` : '1.05em')
        .text(line));
    });
    const zoom = d3.zoom().scaleExtent([.8,4]).on('zoom',event => viewport.attr('transform',event.transform));
    svg.call(zoom).on('dblclick.zoom',null);
  }

  function draw() {
    const host = rootEl.querySelector('.kg-canvas');
    const width = Math.max(320, Math.round(host.getBoundingClientRect().width));
    const mode = `${detailCode || 'overview'}-${activeCat}`;
    if (width === lastWidth && mode === lastMode && svg.selectAll('*').size()) return;
    lastWidth = width;
    lastMode = mode;
    const focusedModule = activeCat !== 'all';
    const height = width < 480 ? 620 : focusedModule ? Math.min(960, Math.round(width * .96 + 130)) : Math.min(820, Math.round(width * .86 + 80));
    const showConceptLabels = false;
    const showGroupLabels = focusedModule && width >= 520;
    const showUnitLabels = focusedModule && width >= 470;
    const outerReserve = focusedModule ? 150 : 82;
    const radius = Math.max(118, Math.min(width, height) / 2 - outerReserve);
    svg.attr('viewBox', `0 0 ${width} ${height}`).attr('height', height);
    svg.selectAll('g.kg-viewport').remove();
    if (detailCode) {
      renderMindMap(width,height);
      return;
    }
    if (focusedModule) {
      renderModuleMap(width);
      applyFilter();
      return;
    }
    renderCourseMap(width);
    return;
    const viewport = svg.append('g').attr('class','kg-viewport');
    const chart = viewport.append('g').attr('transform', `translate(${width/2},${height/2})`);

    const overviewData = {
      ...treeData,
      children: treeData.children.map(section => ({...section, children: []}))
    };
    const hierarchy = d3.hierarchy(overviewData);
    d3.cluster().size([Math.PI * 2, radius])(hierarchy);
    const byCode = new Map(hierarchy.descendants().filter(d => d.data.code).map(d => [d.data.code,d]));
    const radial = d3.linkRadial().angle(d => d.x).radius(d => d.y);

    chart.append('g').selectAll('path')
      .data(hierarchy.links()).join('path')
      .attr('class', d => `kg-link depth-${d.target.depth} cat-${topCat(d.target)}`)
      .attr('data-category', d => topCat(d.target))
      .attr('d', radial);

    chart.append('g').selectAll('path')
      .data(crossPairs.map(pair => [byCode.get(pair[0]),byCode.get(pair[1])]).filter(pair => pair[0] && pair[1]))
      .join('path')
      .attr('class','kg-cross-link')
      .attr('d', pair => {
        const a = radialPoint(pair[0].x, pair[0].y);
        const b = radialPoint(pair[1].x, pair[1].y);
        return `M${a[0]},${a[1]} Q0,0 ${b[0]},${b[1]}`;
      });

    const nodes = chart.append('g').selectAll('g')
      .data(hierarchy.descendants()).join('g')
      .attr('class', d => `kg-node ${d.data.type} ${d.depth ? `cat-${topCat(d)}` : 'root'}`)
      .attr('data-category', d => d.depth ? topCat(d) : 'root')
      .attr('transform', d => {
        const p = radialPoint(d.x, d.y);
        return `translate(${p[0]},${p[1]})`;
      })
      .on('click', (event,d) => { event.stopPropagation(); setSelection(d); });

    nodes.filter(d => d.data.featured).append('circle')
      .attr('class','kg-focus-ring').attr('r',8.2);
    nodes.append('circle')
      .attr('class','main')
      .attr('r', d => d.data.type === 'root' ? 45 : d.data.type === 'module' ? 9 : d.data.type === 'group' ? 5.5 : d.data.type === 'unit' ? 4.8 : 2.5)
      .attr('data-tooltip', d => `${d.data.name}｜${nodeDescription(d)}`);

    const rootNode = nodes.filter(d => d.depth === 0);
    rootNode.append('text').attr('class','kg-center-label').attr('y',-4).text('大学物理');
    rootNode.append('text').attr('class','kg-center-sub').attr('y',14).text('64学时 · 16周');

    nodes.filter(d => d.data.type === 'module').append('text')
      .attr('class','kg-label module')
      .attr('dy','.32em')
      .attr('x', d => d.x < Math.PI ? 14 : -14)
      .attr('text-anchor', d => d.x < Math.PI ? 'start' : 'end')
      .text(d => `${d.data.short} ${d.data.hours}h`);

    if (showGroupLabels) {
      nodes.filter(d => d.data.type === 'group').append('text')
        .attr('class','kg-label group')
        .attr('dy','.32em')
        .attr('x', d => d.x < Math.PI ? 8 : -8)
        .attr('text-anchor', d => d.x < Math.PI ? 'start' : 'end')
        .attr('transform', d => `rotate(${d.x * 180 / Math.PI - 90})${d.x >= Math.PI ? ' rotate(180)' : ''}`)
        .text(d => d.data.short);
    }

    if (showUnitLabels) {
      nodes.filter(d => d.data.type === 'unit').append('text')
        .attr('class','kg-label unit')
        .attr('dy','.32em')
        .attr('x', d => d.x < Math.PI ? 8 : -8)
        .attr('text-anchor', d => d.x < Math.PI ? 'start' : 'end')
        .attr('transform', d => `rotate(${d.x * 180 / Math.PI - 90})${d.x >= Math.PI ? ' rotate(180)' : ''}`)
        .text(d => d.data.short);
    }

    if (showConceptLabels) {
      nodes.filter(d => d.data.type === 'concept').append('text')
        .attr('class','kg-label concept')
        .attr('dy','.32em')
        .attr('x', d => d.x < Math.PI ? 7 : -7)
        .attr('text-anchor', d => d.x < Math.PI ? 'start' : 'end')
        .attr('transform', d => `rotate(${d.x * 180 / Math.PI - 90})${d.x >= Math.PI ? ' rotate(180)' : ''}`)
        .text(d => d.data.name);
    }

    installZoom(viewport);
    svg.on('click', () => setSelection(hierarchy));
    applyFilter();
  }

  rootEl.querySelectorAll('.kg-filter').forEach(btn => btn.addEventListener('click', () => {
    activeCat = btn.dataset.cat;
    lastWidth = 0;
    if (activeCat === 'all') {
      titleEl.textContent = '大学物理';
      textEl.textContent = '以守恒定律、场、波动、统计与量子化为主线，连接六大知识模块。';
    } else {
      const section = sections[Number(activeCat)];
      titleEl.textContent = section.name;
      textEl.textContent = `${section.hours}学时 · ${section.units.length}个教学单元。${section.desc}`;
    }
    draw();
  }));

  backEl.addEventListener('click',closeMindMap);
  zoomOutEl.addEventListener('click',() => zoomBy(1 / 1.25));
  zoomResetEl.addEventListener('click',resetZoom);
  zoomInEl.addEventListener('click',() => zoomBy(1.25));

  new ResizeObserver(draw).observe(rootEl.querySelector('.kg-canvas'));
  draw();
})();
</script>

</main>

  </div>
</footer>
</body>
