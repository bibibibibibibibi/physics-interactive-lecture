<script type="module">

$('legend').innerHTML=compare?sweepDampings.map((z,i)=>{const p=displacementPeak({z});return`<span><i class="swatch" style="background:${colors[i]}"></i>β=${z.toFixed(2)} ω₀ · ωᵣ=${p.r.toFixed(3)} ω₀<br><small>Amax/Ast=${(p.A/.01).toFixed(3)}</small></span>`}).join(''):legends.map(([label,color])=>`<span><i class="swatch" style="background:${color}"></i>${label}</span>`).join('');

function model(extra={}){return{omega0:OMEGA0,f0:DEFAULT_FORCE,r:cfg.r,z:cfg.z,x0,v0,...extra}}
function syncControls(){

// Manual controls, presets, parent parameter messages, and demo all share this path.
function setParameters(p,{restart=false,fromDemo=false}={}){
 const r=Number.isFinite(p.r)?Math.max(.1,Math.min(2,p.r)):cfg.r,z=Number.isFinite(p.z)?Math.max(0,Math.min(1.5,p.z)):cfg.z;
 cfg={r:mode==='damping'?defaults.r:r,z:mode==='frequency'?.08:z};syncControls();
 if(!fromDemo){manual=true;demo=false;if(restart){time=held=0;startStamp=performance.now();running=!compare;$('play').textContent=running?'暂停':'开始'}}

}
function reset({lesson=false}={}){manual=!lesson;demo=false;running=false;time=held=0;startStamp=performance.now();setParameters(defaults,{fromDemo:true});$('play').textContent='开始';render()}

function demoParameters(t){
 if(mode==='sweep')setParameters({r:.3+1.5*Math.min(1,t/8),z:defaults.z},{fromDemo:true});
 else if(mode==='phase')setParameters({r:t<3?.6:t<6?1:1.5,z:defaults.z},{fromDemo:true});
 else setParameters(defaults,{fromDemo:true});
}
$('r').oninput=e=>setParameters({r:+e.target.value},{restart:true});$('z').oninput=e=>setParameters({z:+e.target.value},{restart:true});
$('reset').onclick=()=>reset();$('demo').onclick=()=>startDemo();
$('play').onclick=()=>{manual=true;demo=false;if(running){held=time;running=false}else{if(time>=duration)time=held=0;startStamp=performance.now()-time*1000;running=true}$('play').textContent=running?'暂停':'继续';render()};
$('time').oninput=e=>{manual=true;running=false;demo=false;time=held=+e.target.value;$('play').textContent='继续';render()};
function audio(){if(parent===window)return null;try{return parent.document.querySelector('audio')}catch{return null}}
if(q.has('page'))fetch('./weblec.json').then(r=>r.ok?r.json():Promise.reject()).then(data=>{
 const p=data.slides.find(p=>p.id===+q.get('page'));anchor=p?.stepTimes?.[q.get('demoStep')||'2']??null;lessonEnd=p?.t_end??null;pageStart=p?.t_start??null;
 if(Number.isFinite(anchor)&&autoDemo&&!lecture)manual=false;
}).catch(()=>{});
// Opt-in parent protocol supplies a complete snapshot, including on a late iframe load.
// Relative message time is sufficient without audio or weblec fetch. With real parent
// audio, matching absolute anchors permit smooth, exact audio-time rendering between messages.
function receiveLectureState(d){
 if(!autoDemo||!['interactive','static'].includes(d.mode)||!Number.isFinite(d.pageTime)||!Number.isInteger(d.step)||d.step<0)return;
 if(q.has('page')&&Number(d.pageId)!==Number(q.get('page')))return;
 const step=Number(q.get('demoStep')||'2'),start=d.steps?.[step],a=audio();
 const next={mode:d.mode,pageId:d.pageId,pageTime:Math.max(0,d.pageTime),step:d.step,playing:!!d.playing,start:Number.isFinite(start)&&start>=0?start:null,audioTime:a?.currentTime??null};
 const same=lecture&&lecture.mode===next.mode&&lecture.pageId===next.pageId&&lecture.step===next.step&&lecture.start===next.start&&Math.abs(lecture.pageTime-next.pageTime)<1e-9&&lecture.playing===next.playing;

function applyLectureClock(){
 if(!lecture)return;clockSource='lecture-state';
 if(lecture.start===null){time=held=0;running=false;demo=false;setParameters(defaults,{fromDemo:true});$('play').textContent='开始';return}

  else if(lecture.playing&&Number.isFinite(lecture.audioTime))pageTime+=a.currentTime-lecture.audioTime;

function updateClock(){
 if(compare){time=held=0;running=false;demo=false;manual=true;return}

 }

const fontSize=()=>window.innerWidth>1300?24:window.innerWidth>800?21:17;
function axes(c,w,h,{maxX=duration,minY=-1,maxY=1,xLabel='t / s',yLabel='x / cm',top=38,bottom=52,left=74}={}){

function curve(c,a,fn,color,{limit=a.maxX,lineWidth=3.2,dash=[],alpha=1,clip=true}={}){

 for(let i=0;i<=count;i++){const x=limit*i/count,y=fn(x);if(!Number.isFinite(y)||Math.abs(y)>1e6){open=false;continue}const X=a.xx(x),Y=a.yy(y);if(!open){c.moveTo(X,Y);open=true}else c.lineTo(X,Y)}c.stroke();c.restore();

function cursor(c,a,x){c.save();c.strokeStyle='#50657a';c.lineWidth=2;c.setLineDash([7,7]);c.beginPath();c.moveTo(a.xx(x),a.top);c.lineTo(a.xx(x),a.h-a.bottom);c.stroke();c.restore()}
let extentCache={key:'',max:8};
function extent(models){const key=JSON.stringify(models);if(extentCache.key===key)return extentCache.max;let m=1;for(const p of models)for(let i=0;i<=400;i++){const s=responseAt(duration*i/400,p);m=Math.max(m,Math.abs(s.x)*100);if(mode==='response')m=Math.max(m,Math.abs(s.particular)*100,Math.abs(s.transient)*100)}extentCache={key,max:Math.ceil(m*1.08*2)/2};return extentCache.max}
function drawResponse(){const{c,w,h}=context($('plot'));const models=mode==='frequency'?frequencies.map(r=>model({r,z:.08})):mode==='damping'?dampings.map(z=>model({z,r:defaults.r})):[model()];if(mode!=='response')models.push(model());const mx=extent(models);const a=axes(c,w,h,{minY:-mx,maxY:mx});
 if(mode==='response'){
  curve(c,a,t=>responseAt(t,model()).particular*100,colors[2],{limit:time,lineWidth:3,dash:[10,6]});
  curve(c,a,t=>responseAt(t,model()).transient*100,'#75869a',{limit:time,lineWidth:3,dash:[3,5]});
  curve(c,a,t=>responseAt(t,model()).x*100,colors[0],{limit:time,lineWidth:4.5});
 }else{
  for(let i=0;i<models.length-1;i++)curve(c,a,t=>responseAt(t,models[i]).x*100,colors[i],{limit:time,lineWidth:2.7,alpha:.72});
  const selected=(presetKey==='r'?frequencies:dampings).findIndex(v=>Math.abs(v-cfg[presetKey])<.0001);
  curve(c,a,t=>responseAt(t,model()).x*100,selected>=0?colors[selected]:colors[0],{limit:time,lineWidth:5});
 }
 cursor(c,a,time);const s=responseAt(time,model());c.fillStyle=mode==='response'?'#bd2f39':colors[0];c.beginPath();c.arc(a.xx(time),a.yy(s.x*100),5.5,0,2*Math.PI);c.fill();
}
function drawSweep(){const{c,w,h}=context($('plot'));const maxY=compare?6:12,a=axes(c,w,h,{maxX:2,minY:0,maxY,xLabel:'ω / ω₀',yLabel:'A / Ast'});plotGeometry={canvasHeight:h,innerHeight:h-a.top-a.bottom,maxY};
 for(let i=0;i<sweepDampings.length;i++)curve(c,a,r=>normalizedAmplitude(r,sweepDampings[i]),colors[i],{lineWidth:3,alpha:.72});
 const selected=sweepDampings.findIndex(z=>Math.abs(z-cfg.z)<.0001),color=selected<0?colors[3]:colors[selected];curve(c,a,r=>normalizedAmplitude(r,cfg.z),color,{lineWidth:5});
 const amp=normalizedAmplitude(cfg.r,cfg.z);if(!compare){cursor(c,a,cfg.r);c.fillStyle=color;c.beginPath();c.arc(a.xx(cfg.r),a.yy(Math.min(maxY-.3,amp)),7,0,2*Math.PI);c.fill();}
 const peak=displacementPeak(model());if(peak.exists){c.strokeStyle=color;c.lineWidth=2;c.setLineDash([4,6]);c.beginPath();c.moveTo(a.xx(peak.r),a.top);c.lineTo(a.xx(peak.r),h-a.bottom);c.stroke();c.setLineDash([])}
 if(compare)for(let i=0;i<sweepDampings.length;i++){const p=displacementPeak(model({z:sweepDampings[i]}));c.fillStyle=colors[i];c.beginPath();c.arc(a.xx(p.r),a.yy(p.A/.01),5,0,2*Math.PI);c.fill()}
 if(amp>maxY||compare&&peak.A/.01>maxY){c.fillStyle='#b85c0b';c.textAlign='right';c.fillText(peak.finite?`当前峰超过纵轴 ${maxY}，曲线已截断`:'β=0：无有限稳态共振峰',w-30,28);c.textAlign='left'}
}
function drawPhase(){const{c,w,h}=context($('plot'));const gap=8,half=(h-gap)/2,phase=steadyState(model()),span=3,segment=demo?Math.floor(Math.min(time,8.999)/3)*3:0,local=demo?time-segment:Math.min(time,3);
 plotGeometry={canvasHeight:h,phasePanelHeight:half,phaseInnerHeight:half-38-64};
 c.save();const a=axes(c,w,half,{maxX:span,minY:-1.2,maxY:1.2,yLabel:'f / f₀',bottom:64});curve(c,a,t=>Math.cos(OMEGA0*cfg.r*t),colors[2],{lineWidth:4});cursor(c,a,Math.max(0,Math.min(span,local)));c.restore();
 c.save();c.translate(0,half+gap);const b=axes(c,w,half,{maxX:span,minY:-1.2,maxY:1.2,yLabel:'xₚ / A',bottom:64});if(phase.boundedPeriodic&&!phase.resonant)curve(c,b,t=>phase.A===0?0:(phase.C*Math.cos(OMEGA0*cfg.r*t)+phase.S*Math.sin(OMEGA0*cfg.r*t))/phase.A,colors[0],{lineWidth:4});else{c.fillStyle='#b85c0b';c.fillText('无有限稳态，不能用 xₚ/A 归一化',b.left+10,half/2)}cursor(c,b,Math.max(0,Math.min(span,local)));c.restore();
}
function drawSpring(){if(mode!=='response')return;const{c,w,h}=context($('spring')),s=responseAt(time,model()),range=extent([model()])/100;const center=w*.55,scale=w*.27/range,block=center+s.x*scale,ground=h-28,y=ground-38;
 c.fillStyle='#edf5fd';c.fillRect(0,0,w,h);c.strokeStyle='#667e97';c.lineWidth=3;c.beginPath();c.moveTo(34,15);c.lineTo(34,ground);c.moveTo(34,ground);c.lineTo(w-25,ground);c.stroke();
 c.strokeStyle='#245ea0';c.lineWidth=4;c.beginPath();c.moveTo(34,y);c.lineTo(65,y);const start=65,end=block-40;for(let i=0;i<=18;i++){const x=start+(end-start)*i/18;c.lineTo(x,y+(i===0||i===18?0:i%2?17:-17))}c.lineTo(block-29,y);c.stroke();
 c.fillStyle='#245ea0';c.fillRect(block-29,y-27,58,54);c.fillStyle='white';c.font='24px sans-serif';c.textAlign='center';c.fillText('m',block,y+8);
 c.strokeStyle='#8094aa';c.lineWidth=2;c.setLineDash([5,5]);c.beginPath();c.moveTo(center,12);c.lineTo(center,ground+9);c.stroke();c.setLineDash([]);c.fillStyle='#586e84';c.font=fontSize()+'px sans-serif';c.fillText('x=0',center,ground+23);c.textAlign='left';c.fillStyle='#17324d';c.fillText('完整位移 '+(s.x*100).toFixed(2)+' cm',Math.max(75,w-320),23);
}
function render(){
 const s=responseAt(time,model()),st=steadyState(model()),regime={underdamped:'欠阻尼',critical:'临界阻尼',overdamped:'过阻尼'}[s.regime];
 let info='';if(mode==='sweep'){const p=displacementPeak(model());info=compare?`当前 β=${cfg.z.toFixed(2)} ω₀<br>`+(p.exists?`ωᵣ=${p.r.toFixed(3)} ω₀<br>Amax/Ast=${p.finite?(p.A/.01).toFixed(3):'无有限值'}`:'无正频率位移峰<br>最大值：ω=0，A/Ast=1')+(p.A/.01>6?'<br>超过纵轴 6，已截断':''):`当前 A/Ast：${Number.isFinite(st.A)?(st.A/.01).toFixed(2):'无有限值'}<br>`+(p.exists?`峰频率：${p.r.toFixed(3)} ω₀`:'无正频率位移峰（最大值在ω=0）');drawSweep()}
 else if(mode==='phase'){info=`位移滞后 φ：${st.phi===null?'无有限稳态':(st.phi/Math.PI).toFixed(3)+' π'}<br>当前 ω=${cfg.r.toFixed(2)} ω₀`;drawPhase()}
 else{info=`完整 x：${(s.x*100).toFixed(2)} cm<br>同频项 A：${Number.isFinite(st.A)?(st.A*100).toFixed(2)+' cm':'随时间增长'}`;drawResponse();drawSpring()}
 if(info!==lastReadout){$('readout').innerHTML=info;lastReadout=info}
 const status=lecture&&!manual&&lecture.start===null?'课堂演示锚点缺失：保持初态':cfg.z===0?(st.resonant?'无阻尼本征共振：响应包络随时间增长':'β=0：暂态不衰减，完整响应不收敛到同频项'):regime+' · '+(manual?'手动演示':'跟随课堂时钟');
 if(status!==lastStatus){$('status').textContent=status;lastStatus=status}
 $('time').value=time;$('time-out').textContent=time.toFixed(2)+' s';
 window.sp3State={mode,compare,autoDemo,r:cfg.r,z:cfg.z,time,running,demo,manual,anchor,clockSource:manual?'local':clockSource,timelineMode:lecture?.mode??null,timelineAnchorStatus:lecture?(lecture.start===null?'missing':'ready'):'none',regime:s.regime,x:s.x,v:s.v,A:st.A,phi:st.phi,readout:$('readout').textContent,plotGeometry:{...plotGeometry}};
}
window.sp3Sim={setParameters,reset,startDemo,setTime(t){manual=true;running=false;demo=false;time=held=compare?0:Math.max(0,Math.min(duration,t));render()},getState:()=>({...window.sp3State})};
function frame(){updateClock();render();requestAnimationFrame(frame)}syncControls();render();requestAnimationFrame(frame);
</script></body></html>
