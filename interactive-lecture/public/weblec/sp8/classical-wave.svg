<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
<title id="title">经典受迫振动与同频再辐射示意</title><desc id="desc">入射电磁波以频率 nu zero 使电子沿电场所在直线往复运动。经典受迫响应产生同频的再辐射，散射方向影响强度分布。</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#245c99"/></marker><marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#187368"/></marker></defs>
<rect width="1080" height="650" fill="#f8fbff"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="34" fill="#17304d">
<text x="540" y="60" text-anchor="middle" font-size="38" font-weight="700">经典框架：电子受迫振动并再辐射</text>
<path d="M70 310H422" stroke="#245c99" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M70 310Q92 240 114 310T158 310T202 310T246 310T290 310T334 310T378 310T422 310" stroke="#245c99" stroke-width="5" fill="none"/>
<text x="246" y="190" text-anchor="middle" fill="#245c99">入射频率 ν₀</text>
<path d="M488 218V402" stroke="#187368" stroke-width="4" marker-start="url(#g)" marker-end="url(#g)"/>
<circle cx="540" cy="310" r="25" fill="#187368"/>
<text x="540" y="320" fill="#fff" font-size="38" text-anchor="middle">−</text>
<text x="540" y="462" text-anchor="middle" fill="#187368">沿电场所在直线往复</text>
<text x="540" y="506" text-anchor="middle" fill="#187368">振动频率 ν₀</text>
<path d="M590 310H994" stroke="#245c99" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M598 310Q620 240 642 310T686 310T730 310T774 310T818 310T862 310T906 310T950 310T994 310" stroke="#b83e35" stroke-width="5" fill="none"/>
<text x="794" y="190" text-anchor="middle" fill="#b83e35">再辐射频率 ν′ = ν₀</text>
<text x="540" y="584" text-anchor="middle" font-size="31" fill="#526c84">同频受迫响应能改变角度分布，无法给出随角度移动的长波峰</text>
</g></svg>
