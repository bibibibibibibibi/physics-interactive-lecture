</style></head><body><main id="app">
<div class="top"><h1 id="title">散射角与光谱双峰</h1><span class="clockstatus" id="clockStatus">手动调节 · 可重复演示</span></div>
<div class="main"><section class="panel"><h2 id="sceneTitle">左：光子散射几何</h2><svg id="scene" class="scene" viewBox="0 0 720 394" role="img" aria-label="光子散射几何"></svg><p class="caption" id="sceneCaption"></p></section>
<section class="panel"><h2 id="chartTitle">右：同一光谱中的两个成分</h2><svg id="chart" class="chart" viewBox="0 0 855 362" role="img" aria-label="理论示意曲线"></svg><div class="metrics" id="metrics"></div><p class="hint" id="chartCaption"></p></section></div>
<div class="controls"><div class="control" id="thetaControl"><label for="theta">散射极角 θ <output id="thetaOut"></output></label><input id="theta" type="range" min="0" max="180" step="1" value="45"><p class="small" id="thetaHint">入射方向延长线与散射方向夹角</p></div>

<div class="control hidden" id="psiControl"><label for="psi">偏振方向 ψ <output id="psiOut"></output></label><input id="psi" type="range" min="0" max="180" step="1" value="30"><p class="small">Π&gt;0 时，峰在 ψ ± 90°</p></div>
<div class="control hidden" id="polControl"><label for="pol">偏振度 Π <output id="polOut"></output></label><input id="pol" type="range" min="0" max="100" step="1" value="60"><p class="small">Π = μ / μ₁₀₀</p></div>
<div class="control" id="constantControl"><label>电子康普顿波长</label><p style="font:29px/1.4 Georgia,serif;margin:0;color:var(--blue)">λ<sub>C</sub> = 2.42631 pm</p><p class="small">近似自由且初始静止电子</p></div>
<div class="control"><div class="actions"><button id="demo" type="button">重播演示</button><button id="reset" type="button">复位</button></div><p class="hint" id="actionHint">8 秒扫角：45° 至 135°</p></div></div>
</main><script>
'use strict';
// Compact teaching modes adapted from the local source laboratory:
// /Users/xm/Documents/青教赛筑基/PPT-康普顿散射/网页演示/康普顿散射-碰撞交互演示.html
// Physics and source wave construction are retained; layout, analytic clock, angle
// graph and polarimetry example are new. No external dependencies or event data.
const q=new URLSearchParams(location.search),mode=['spectrum','angle','polar','polar-geometry'].includes(q.get('mode'))?q.get('mode'):'spectrum';
const pageId=Number(q.get('page')||({spectrum:4,angle:12,'polar-geometry':19,polar:20}[mode])),$=id=>document.getElementById(id);
const LC=2.42631023538,HC=1239.841984,DEG=Math.PI/180,MU100=.5;
const defaults={theta:mode.startsWith('polar')?90:45,lambda:70.9,phi:45,psi:30,pol:60};
let state={...defaults},anchor=null,manualOverride=true,lastAudioTime=null,localRunning=false,localStart=0,clockTime=0,clockKind='manual',lastLecture=null;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function params(patch,origin='manual'){
  state={...state,...patch};state.theta=clamp(state.theta,0,180);state.lambda=clamp(state.lambda,20,200);state.phi=clamp(state.phi,0,180);state.psi=clamp(state.psi,0,180);state.pol=clamp(state.pol,0,100);
  if(mode==='polar')state.theta=90;
  if(origin==='manual'){manualOverride=true;localRunning=false;clockKind='manual';clockTime=0}
  ['theta','lambda','phi','psi','pol'].forEach(k=>$(k).value=state[k]);render();
}
function physics(){const tr=state.theta*DEG,delta=LC*(1-Math.cos(tr)),lambda1=state.lambda+delta,E=HC/state.lambda,E1=HC/lambda1;return{tr,delta,lambda1,E,E1,K:E-E1,px:E-E1*Math.cos(tr),py:-E1*Math.sin(tr)}}
function pointAt(o,L,a){return{x:o.x+L*Math.cos(a),y:o.y-L*Math.sin(a)}}
function wavePath(a,b,visualLambda,amp=6){const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy);if(L<1)return'';const ux=dx/L,uy=dy/L,nx=-uy,ny=ux,n=Math.ceil(L/3);let d='';for(let i=0;i<=n;i++){const s=L*i/n,off=amp*Math.sin(2*Math.PI*s/visualLambda)*Math.sin(Math.PI*i/n);d+=(i?'L':'M')+(a.x+ux*s+nx*off).toFixed(2)+' '+(a.y+uy*s+ny*off).toFixed(2)+' '}return d}
function arc(o,r,a0,a1){const a=pointAt(o,r,a0),b=pointAt(o,r,a1);return`M${a.x} ${a.y} A${r} ${r} 0 ${Math.abs(a1-a0)>Math.PI?1:0} ${a1>a0?0:1} ${b.x} ${b.y}`}
const defs='<defs><marker id="blueArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#245c99"/></marker><marker id="redArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#b83e35"/></marker><marker id="greenArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#187368"/></marker></defs>';
function line(a,b,c='blue',dash=false,w=5){return`<path d="M${a.x},${a.y}L${b.x},${b.y}" stroke="${{blue:'#245c99',red:'#b83e35',green:'#187368'}[c]}" stroke-width="${w}" fill="none" ${dash?'stroke-dasharray="8 6"':''} marker-end="url(#${c}Arrow)"/>`}
function text(x,y,s,c='#17304d',size=27,anchor='start'){return`<text x="${x}" y="${y}" fill="${c}" font-size="${size}" text-anchor="${anchor}" class="label" ${c==='#fff'?'style="stroke:none"':''}>${s}</text>`}
function sceneCompton(p){
 const o={x:338,y:205},out=pointAt(o,173,p.tr),ein={x:45,y:o.y},recoil=Math.hypot(p.px,p.py)>1e-8?{x:o.x+125*p.px/Math.hypot(p.px,p.py),y:o.y-125*p.py/Math.hypot(p.px,p.py)}:o;
 const thetaLabel=pointAt(o,88,p.tr/2),guide={x:665,y:o.y};
 let s=defs+line(ein,o,'blue')+line(o,guide,'blue',true,2)+line(o,out,'red')+`<path d="${wavePath({x:52,y:192},{x:309,y:192},30)}" stroke="#245c99" stroke-width="3" fill="none"/>`+`<path d="${arc(o,65,0,p.tr)}" stroke="#b83e35" stroke-width="3" fill="none"/>`+text(thetaLabel.x,thetaLabel.y,'θ','#b83e35',30,'middle')+`<circle cx="${o.x}" cy="${o.y}" r="15" fill="#187368"/>`+text(170,163,'入射光子','#245c99',28,'middle')+text(653,240,'入射延长线','#526c84',25,'end');
 if(p.delta>1e-8)s+=line(o,recoil,'green')+`<circle cx="${recoil.x}" cy="${recoil.y}" r="9" fill="#187368"/>`+text(clamp(recoil.x-32,120,520),clamp(recoil.y+43,270,370),'电子反冲','#187368',28,'middle');
 const lx=clamp(out.x,120,620),ly=clamp(out.y-28,32,352);s+=`<rect x="${out.x-18}" y="${out.y-18}" width="36" height="36" rx="4" fill="#f5d7d3" stroke="#b83e35" stroke-width="3"/>`+text(lx,ly,'散射光子 / 探测方向','#b83e35',27,'middle')+text(338,390,'方向示意，箭长和物体大小不表示真实尺度','#526c84',24,'middle');
 $('scene').innerHTML=s;$('sceneCaption').innerHTML=state.theta<1e-6?'θ = <strong>0°</strong>：前向极限，波长不变，电子反冲动量为零。':`θ = <strong>${state.theta.toFixed(0)}°</strong>：光子转向并把能量、动量交给电子。`;
}
function axes(x0,y0,x1,y1,xlabel,ylabel,footer=78){return`<path d="M${x0},${y1}V${y0}H${x1}" fill="none" stroke="#66819f" stroke-width="2"/>`+text((x0+x1)/2,y0+footer,xlabel,'#526c84',25,'middle')+text(x0-70,y1-12,ylabel,'#526c84',24,'start')}
function spectrum(p){
 const L=72,R=812,T=54,B=245,min=state.lambda-1.1,max=state.lambda+2*LC+1.1,X=v=>L+(v-min)/(max-min)*(R-L),sigma=.24;
 let ys=[],peak=0;for(let i=0;i<=300;i++){const lam=min+(max-min)*i/300,y=.9*Math.exp(-.5*((lam-state.lambda)/sigma)**2)+.76*Math.exp(-.5*((lam-p.lambda1)/(sigma*1.08))**2);peak=Math.max(peak,y);ys.push([lam,y])}
 const path=ys.map(([x,y],i)=>`${i?'L':'M'}${X(x).toFixed(1)},${(B-y/peak*(B-T)).toFixed(1)}`).join(' '),x0=X(state.lambda),x1=X(p.lambda1);
 let s=axes(L,B,R,T,'波长 λ / pm','I',107)+`<path d="${path}" fill="none" stroke="#263f5f" stroke-width="5"/><path d="M${x0},${B}V${T-5}" stroke="#245c99" stroke-width="2" stroke-dasharray="7 5"/><path d="M${x1},${B}V${T-5}" stroke="#b83e35" stroke-width="2" stroke-dasharray="7 5"/>`;
 if(p.delta<.05){s+=text(x0,T-12,'λ 与 λ′ 重合','#245c99',26,'middle')}
 else{s+=text(x0-(p.delta<1?16:0),T-12,'λ','#245c99',29,'middle')+text(x1+(p.delta<1?16:0),T-12,'λ′','#b83e35',29,'middle')+`<path d="M${x0},${B+13}V${B+23}H${x1}V${B+13}" fill="none" stroke="#b83e35" stroke-width="3"/>`+text((x0+x1)/2,B+52,'Δλ','#b83e35',26,'middle')}
 for(const v of [state.lambda,state.lambda+2*LC])s+=text(X(v),B+79,v.toFixed(1),'#526c84',24,'middle');
 $('chart').innerHTML=s;$('metrics').innerHTML=`<span>λ = <b>${state.lambda.toFixed(1)}</b> pm</span><span>λ′ = <b>${p.lambda1.toFixed(2)}</b> pm</span><span>Δλ = <b>${p.delta.toFixed(2)}</b> pm</span>`;
 $('chartCaption').textContent='峰高、线宽和归一化纵轴为教学示意，非测量。未位移成分与位移成分可以重叠。';
}
function angleChart(p){
 const L=84,R=805,T=32,B=273,X=v=>L+v/180*(R-L),Y=v=>B-v/(2*LC)*(B-T);
 let s=axes(L,B,R,T,'散射极角 θ / °','Δλ / pm');for(const v of [0,90,180])s+=text(X(v),B+40,v,'#526c84',25,'middle');
 for(const v of [0,LC,2*LC])s+=`<path d="M${L},${Y(v)}H${R}" stroke="#dbe6f1" stroke-width="2"/>`+text(L-13,Y(v)+9,v.toFixed(2),'#526c84',24,'end');
 let d='';for(let i=0;i<=180;i++)d+=(i?'L':'M')+X(i).toFixed(1)+','+Y(LC*(1-Math.cos(i*DEG))).toFixed(1)+' ';
 s+=`<path d="${d}" fill="none" stroke="#245c99" stroke-width="5"/><path d="M${X(state.theta)},${B}V${Y(p.delta)}H${L}" fill="none" stroke="#b83e35" stroke-width="2" stroke-dasharray="7 5"/><circle cx="${X(state.theta)}" cy="${Y(p.delta)}" r="9" fill="#b83e35"/>`;
 $('chart').innerHTML=s;$('metrics').innerHTML=`<span>Δλ = <b>${p.delta.toFixed(2)}</b> pm</span><span>λ′ = <b>${p.lambda1.toFixed(2)}</b> pm</span><span>Kₑ = <b>${p.K.toFixed(3)}</b> keV</span>`;
 $('chartCaption').textContent='理论曲线：Δλ = λC(1 − cosθ)。固定 θ 改变 λ，位移不变，能量转移会改变。';
}
function polarScene(){
 const o={x:365,y:221},r=155,a=state.phi*DEG,psi=state.psi*DEG,hit1=pointAt(o,-95,a),hit2=pointAt(o,95,a),perp=pointAt(o,166,psi),opposite=pointAt(o,-166,psi);
 const axial=mode==='polar-geometry'&&(state.theta<1e-6||state.theta>180-1e-6);
 let s=defs;
 for(let i=-4;i<=4;i++)for(let j=-3;j<=3;j++)s+=`<rect x="${o.x+i*39-16}" y="${o.y+j*39-16}" width="32" height="32" rx="3" fill="#e5eef8" stroke="#a7bdd6"/>`;
 if(mode==='polar')s+=state.pol>0?line(opposite,perp,'green',true,4)+text(610,340,`电场方向 ψ = ${state.psi.toFixed(0)}°`,'#187368',27,'end'):text(610,340,'Π = 0：无固定偏振方向','#187368',27,'end');
 s+=line({x:185,y:o.y},{x:602,y:o.y},'blue',true,2)+text(611,o.y+7,'x','#245c99',24);
 if(!axial){s+=`<path d="M${hit1.x},${hit1.y}L${hit2.x},${hit2.y}" stroke="#b83e35" stroke-width="6"/><circle cx="${hit1.x}" cy="${hit1.y}" r="17" fill="#245c99"/><circle cx="${hit2.x}" cy="${hit2.y}" r="17" fill="#b83e35"/>`+text(hit1.x,hit1.y+8,'1','#fff',25,'middle')+text(hit2.x,hit2.y+8,'2','#fff',25,'middle');
 s+=`<path d="${arc(o,78,0,a)}" stroke="#b83e35" stroke-width="3" fill="none"/>`+text(pointAt(o,106,a/2).x,pointAt(o,106,a/2).y,'φ','#b83e35',29,'middle')}
 else{s+=text(365,130,'轴向极限：φ 不定','#b83e35',29,'middle')}
 s+=`<circle cx="${o.x}" cy="${o.y}" r="10" fill="#fff" stroke="#17304d" stroke-width="2"/><circle cx="${o.x}" cy="${o.y}" r="3" fill="#17304d"/>`+text(359,42,'俯视探测棒阵列：入射方向垂直于图面','#526c84',25,'middle');
 // Side inset: polar angle is shown in a section containing the incident direction.
 const io={x:87,y:293},ia=state.theta*DEG,tip=pointAt(io,61,ia);s+=line({x:22,y:293},io,'blue',false,3)+line(io,{x:155,y:293},'blue',true,2)+line(io,tip,'red',false,3)+`<path d="${arc(io,30,0,ia)}" stroke="#b83e35" fill="none" stroke-width="2"/>`+text(87,371,`侧视 θ = ${state.theta.toFixed(0)}°`,'#245c99',24,'middle');
 $('scene').innerHTML=s;$('sceneCaption').innerHTML=axial?'轴向极限，散射平面无唯一定义，<strong>φ 不定</strong>。此时不显示唯一的棒连线方位。':'θ 衡量光子<strong>转过多大角度</strong>；φ 描述散射平面<strong>绕入射方向的方位</strong>。两棒连线无箭头，方位模 180°。';
}
function polarChart(){
 const L=79,R=806,T=50,B=274,X=v=>L+v/180*(R-L),Y=v=>B-(v-.35)/1.3*(B-T),mu=MU100*state.pol/100,n=v=>1-mu*Math.cos(2*(v-state.psi)*DEG);
 let s=axes(L,B,R,T,'方位角 φ / °','N / 均值');for(const v of [0,45,90,135,180])s+=text(X(v),B+42,v,'#526c84',25,'middle');
 for(const v of [.5,1,1.5])s+=`<path d="M${L},${Y(v)}H${R}" stroke="#dbe6f1" stroke-width="2"/>`+text(L-14,Y(v)+9,v.toFixed(1),'#526c84',24,'end');
 let d='';for(let i=0;i<=360;i++){const v=i/2;d+=(i?'L':'M')+X(v).toFixed(1)+','+Y(n(v)).toFixed(1)+' '}
 s+=`<path d="${d}" fill="none" stroke="#245c99" stroke-width="5"/><circle cx="${X(state.phi)}" cy="${Y(n(state.phi))}" r="9" fill="#b83e35"/><path d="M${X(state.phi)},${B}V${Y(n(state.phi))}" stroke="#b83e35" stroke-width="2" stroke-dasharray="7 5"/>`+text(444,28,'N(φ) ∝ 1 − μ cos 2(φ − ψ)','#245c99',28,'middle');
 $('chart').innerHTML=s;$('metrics').innerHTML=`<span>假设 μ₁₀₀ = <b>0.50</b></span><span>μ = <b>${mu.toFixed(2)}</b></span><span>Π = <b>${state.pol.toFixed(0)}%</b></span>`;
 $('chartCaption').textContent=state.pol>0?'固定 θ=90° 的理论示意，无 POLAR 事件数据。μ₁₀₀=0.50 仅作假设，实际值由仪器响应确定。':'固定 θ=90°、假设 μ₁₀₀=0.50 的理论示意。Π=0 时曲线无调制，不能由曲线确定 ψ。';
}
function polarGeometryChart(){
 const o={x:410,y:233},tr=state.theta*DEG,out=pointAt(o,177,tr),a=pointAt(o,91,tr/2);
 let s=defs+line({x:93,y:o.y},o,'blue')+line(o,{x:730,y:o.y},'blue',true,2)+line(o,out,'red')+`<circle cx="${o.x}" cy="${o.y}" r="12" fill="#187368"/><path d="${arc(o,69,0,tr)}" fill="none" stroke="#b83e35" stroke-width="3"/>`+text(a.x,a.y,'θ','#b83e35',31,'middle')+text(211,285,'入射方向','#245c99',29,'middle')+text(730,285,'入射延长线','#526c84',25,'end')+text(clamp(out.x,120,700),clamp(out.y-30,27,326),'散射方向','#b83e35',28,'middle');
 const axial=state.theta<1e-6||state.theta>180-1e-6;
 $('chart').innerHTML=s;$('metrics').innerHTML=`<span>散射极角 θ = <b>${state.theta.toFixed(0)}°</b></span><span>方位角 φ = <b>${axial?'不定':state.phi.toFixed(0)+'°'}</b></span>`;
 $('chartCaption').textContent='几何教学示意，无真实事件。两棒连线给出投影方位，不能仅凭两个位置读出散射极角。';
}
function render(){
 ['theta','phi','psi'].forEach(k=>$(k+'Out').textContent=state[k].toFixed(0)+'°');$('lambdaOut').textContent=state.lambda.toFixed(1)+' pm';$('polOut').textContent=state.pol.toFixed(0)+'%';
 if(mode.startsWith('polar')){const axial=mode==='polar-geometry'&&(state.theta<1e-6||state.theta>180-1e-6);$('phi').disabled=axial;if(axial)$('phiOut').textContent='不定';polarScene();mode==='polar'?polarChart():polarGeometryChart()}else{const p=physics();sceneCompton(p);mode==='spectrum'?spectrum(p):angleChart(p)}
 $('clockStatus').textContent=clockKind==='lesson'?'随讲稿演示 · 回拖可重播':clockKind==='demo'?`演示 ${clockTime.toFixed(1)} / 8.0 秒`:'手动调节 · 可重复演示';
 window.sp8State={mode,pageId,params:{...state},physics:physics(),mu:MU100*state.pol/100,anchor,manualOverride,clockTime,clockKind,protocol:lastLecture?'lecture-state':'legacy',lecture:lastLecture?{...lastLecture}:null};
}
function derivedDemo(t,kind){clockTime=clamp(t,0,8);clockKind=kind;const k=mode==='polar'?'psi':mode==='polar-geometry'?'phi':'theta';params({...defaults,[k]:(k==='psi'?30:45)+90*clockTime/8},'clock')}
function parentAudio(){try{return parent!==window?parent.document.querySelector('audio'):null}catch(_){return null}}
function demo(){manualOverride=true;localRunning=true;localStart=performance.now();derivedDemo(0,'demo')}
function reset(){manualOverride=true;localRunning=false;clockTime=0;clockKind='manual';params({...defaults},'clock')}
['theta','lambda','phi','psi','pol'].forEach(k=>$(k).addEventListener('input',()=>params({[k]:Number($(k).value)})));
$('demo').onclick=demo;$('reset').onclick=reset;
// Opt-in parent clock. Once received, it owns lesson time; paused repeated state preserves manual input.
function lectureState(data){
 const pageTime=Number(data.pageTime),step=Number(data.step),start=Number(data.steps?.['2']);
 if(Number(data.pageId)!==pageId||!['interactive','static'].includes(data.mode)||!Number.isFinite(pageTime)||!Number.isFinite(step)||!Number.isFinite(start))return;
 const changed=!lastLecture||lastLecture.mode!==data.mode||lastLecture.step!==step||Math.abs(lastLecture.pageTime-pageTime)>1e-4||Math.abs(lastLecture.start-start)>1e-4;
 lastLecture={mode:data.mode,pageTime,step,start,playing:!!data.playing};
 if(changed){manualOverride=false;localRunning=false}
 if(!manualOverride)derivedDemo(step<2?0:data.mode==='static'?8:pageTime-start,'lesson');
}
window.addEventListener('message',e=>{
 if(e.source!==parent)return;
 if(e.data?.type==='lecture-state'){lectureState(e.data);return}
 // A timeline opt-in replaces legacy step messages, preventing a second demo clock.
 if(lastLecture)return;
 if(e.data?.type==='reset')reset();
 if(e.data?.type==='demo'){const a=parentAudio();if(a&&anchor!==null){manualOverride=false;derivedDemo(a.currentTime-anchor,'lesson')}else demo()}
});
fetch('weblec.json').then(r=>{if(!r.ok)throw new Error('course unavailable');return r.json()}).then(d=>{const s=d.slides?.find(s=>Number(s.id)===pageId);if(Number.isFinite(s?.stepTimes?.['2'])){anchor=s.stepTimes['2'];const a=parentAudio();if(a&&!lastLecture){lastAudioTime=a.currentTime;manualOverride=false}}}).catch(()=>{});
function tick(){
 const a=lastLecture?null:parentAudio();if(a&&anchor!==null){const t=a.currentTime;if(lastAudioTime!==null&&Math.abs(t-lastAudioTime)>1e-4){manualOverride=false;localRunning=false}lastAudioTime=t;if(!manualOverride)derivedDemo(t-anchor,'lesson');else if(localRunning){const dt=(performance.now()-localStart)/1000;derivedDemo(dt,'demo');if(dt>=8)localRunning=false}}
 else if(localRunning){const dt=(performance.now()-localStart)/1000;derivedDemo(dt,'demo');if(dt>=8)localRunning=false}
 requestAnimationFrame(tick);
}
function fit(){const s=Math.min(innerWidth/1710,innerHeight/730);$('app').style.transform=`scale(${s})`;$('app').style.left=((innerWidth-1710*s)/2)+'px';$('app').style.top=((innerHeight-730*s)/2)+'px'}
if(mode==='angle'){$('title').textContent='康普顿位移与散射角';$('chartTitle').textContent='右：位移随极角 θ 的理论曲线';$('lambdaHint').textContent='可调：20 至 200 pm，比较位移与能量'}
if(mode==='spectrum'){$('lambda').disabled=true;$('lambda').style.opacity='.45'}
if(mode.startsWith('polar')){
 document.body.classList.add('polar');$('title').textContent='POLAR 原理：极角 θ 与方位角 φ';$('sceneTitle').textContent='左：两根击中棒的方位';$('chartTitle').textContent='右：许多方位角的理论调制';
 ['lambdaControl','constantControl'].forEach(k=>$(k).classList.add('hidden'));['phiControl','psiControl','polControl'].forEach(k=>$(k).classList.remove('hidden'));$('actionHint').textContent='8 秒转偏振：ψ 为 30° 至 120°';
 if(mode==='polar-geometry'){
  $('title').textContent='POLAR 几何：极角 θ 与方位角 φ';$('chartTitle').textContent='右：含入射方向的截面';['psiControl','polControl'].forEach(k=>$(k).classList.add('hidden'));
  $('constantControl').classList.remove('hidden');$('constantControl').innerHTML='<label>两个角度分别回答</label><p class="small">θ：转过多大角度</p><p class="small">φ：散射平面的方位</p>';
  $('app').querySelector('.controls').style.gridTemplateColumns='1.2fr 1.2fr 1fr 1fr';$('actionHint').textContent='8 秒扫方位：φ 为 45° 至 135°';
 }else{$('theta').disabled=true;$('theta').style.opacity='.45';$('thetaHint').textContent='本页固定 θ=90°，只考察方位调制'}
}
fit();addEventListener('resize',fit);params(defaults,'clock');requestAnimationFrame(tick);
</script></body></html>
