<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc">
<title id="title">康普顿散射动量三角形</title><desc id="desc">入射动量 p 向右，散射动量 p′ 向右上，散射极角 theta 位于入射方向延长线和散射方向之间。电子反冲动量为 p 减去 p′，用首尾相接的绿色箭头表示。</desc>
<defs><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#245c99"/></marker><marker id="r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#b83e35"/></marker><marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#187368"/></marker></defs>
<rect width="1080" height="680" fill="#f8fbff"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="36" fill="#17304d">
<text x="540" y="52" text-anchor="middle" font-weight="700">动量守恒：p = p′ + pₑ</text>
<path d="M170 480H860" stroke="#245c99" stroke-width="7" fill="none" marker-end="url(#b)"/>
<path d="M170 480L731.76 86.66" stroke="#b83e35" stroke-width="7" fill="none" marker-end="url(#r)"/>
<path d="M731.76 86.66L860 480" stroke="#187368" stroke-width="7" fill="none" marker-end="url(#g)"/>
<path d="M170 480H960" stroke="#245c99" stroke-width="2" stroke-dasharray="10 8" fill="none"/>
<path d="M272 480A102 102 0 0 0 253.55 421.49" stroke="#b83e35" stroke-width="3" fill="none"/>
<circle cx="170" cy="480" r="7" fill="#17304d"/>
<text x="295" y="447" fill="#b83e35" font-size="42">θ</text>
<text x="500" y="532" fill="#245c99" text-anchor="middle">入射动量 p = h / λ</text>
<text x="295" y="360" transform="rotate(-35 295 360)" fill="#b83e35">散射动量 p′ = h / λ′</text>
<text x="875" y="240" fill="#187368">pₑ</text>
<text x="925" y="535" fill="#526c84" font-size="28" text-anchor="middle">入射延长线</text>
<text x="540" y="570" text-anchor="middle">pₑ = p − p′，电子反冲动量使三角形闭合</text>
<text x="540" y="625" font-size="29" text-anchor="middle" fill="#526c84">θ：入射延长线与散射光子方向的夹角</text>
</g></svg>
