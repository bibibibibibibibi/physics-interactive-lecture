<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>矢量代数交互实验</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #16283f;
      --muted: #54657b;
      --rule: #d8e0ea;
      --blue: #2362c5;
      --orange: #d16b2b;
      --green: #168365;
      --purple: #8751b5;
      --surface: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: linear-gradient(180deg, #eaf0f8, #f7faff 46%, #fff);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
    }
    button, input { font: inherit; }
    .app { min-height: 100vh; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
    header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; padding: 2px 4px;
    }
    .heading small { display: block; color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 2px 0 0; font-size: clamp(20px, 2vw, 30px); line-height: 1.2; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .tabs button, .reset {
      border: 1px solid #bdcce0; background: #fff; color: #314b70;
      border-radius: 9px; padding: 8px 13px; cursor: pointer; font-weight: 650;
    }
    .tabs button[aria-selected="true"] { color: #fff; border-color: #244b88; background: #244b88; }
    button:hover { filter: brightness(.96); }
    button:focus-visible, input:focus-visible { outline: 3px solid #ffc857; outline-offset: 2px; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(295px, 345px); gap: 12px; flex: 1; min-height: 0; }
    .plot-card, aside { background: rgba(255,255,255,.95); border: 1px solid var(--rule); border-radius: 15px; box-shadow: 0 9px 26px #25476a12; }
    .plot-card { min-width: 0; min-height: 420px; display: flex; flex-direction: column; overflow: hidden; }
    .plot-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 17px 6px; }
    .plot-bar strong { font-size: 15px; }
    .plot-bar span { color: var(--muted); font-size: 13px; text-align: right; }
    svg { display: block; width: 100%; height: 100%; min-height: 350px; flex: 1; touch-action: none; user-select: none; }
    .plot-foot { border-top: 1px solid var(--rule); padding: 9px 16px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .full-link { display: none; color: var(--blue); font-weight: 700; text-decoration: none; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 5px; }
    .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; background: currentColor; }
    .legend .a { color: var(--blue); } .legend .b { color: var(--orange); }
    .legend .sum { color: var(--green); } .legend .diff { color: var(--purple); }
    aside { padding: 16px; overflow-y: auto; }
    aside h2 { font-size: 18px; margin: 0 0 7px; }
    .intro { color: var(--muted); line-height: 1.55; font-size: 14px; margin: 0 0 12px; }
    .readout { display: grid; gap: 8px; }
    .result { border: 1px solid var(--rule); border-left: 4px solid var(--blue); border-radius: 9px; padding: 10px 12px; background: #fbfdff; }
    .result.orange { border-left-color: var(--orange); }
    .result.green { border-left-color: var(--green); }
    .result.purple { border-left-color: var(--purple); }
    .result .name { color: var(--muted); font-size: 12px; }
    .result .value { font: 700 clamp(17px, 1.5vw, 21px)/1.35 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .note { border-radius: 10px; background: #eef4fb; padding: 12px; color: #24466c; line-height: 1.55; font-size: 14px; margin-top: 12px; }
    .controls-title { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--rule); }
    .controls-title strong { font-size: 14px; }
    .reset { font-size: 12px; padding: 5px 9px; }
    .input-row { display: grid; grid-template-columns: 20px 1fr 1fr; align-items: center; gap: 7px; margin-top: 8px; }
    .input-row .label { font-weight: 750; }
    .input-row.a .label { color: var(--blue); } .input-row.b .label { color: var(--orange); }
    .input-row label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
    .input-row input { min-width: 0; width: 100%; border: 1px solid #bdcce0; border-radius: 6px; padding: 5px 6px; color: var(--ink); background: #fff; font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }
    @media (max-width: 850px) {
      .app { padding: 9px; gap: 7px; }
      main { grid-template-columns: minmax(0, 1fr) 250px; gap: 8px; }
      .plot-card { min-height: 0; }
      svg { min-height: 0; }
      aside { padding: 10px; }
      .result { padding: 6px 8px; }
      .result .value { font-size: 16px; }
      .readout { gap: 5px; }
      .note { padding: 8px; font-size: 12px; }
      .intro { margin-bottom: 7px; font-size: 12px; }
      .tabs button { padding: 5px 8px; font-size: 12px; }
    }
    @media (max-width: 650px) {
      main { grid-template-columns: 1fr; }
      .plot-card { min-height: 350px; }
      svg { min-height: 250px; }
      aside { overflow: visible; }
      .readout { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 520px) {
      .tabs { width: 100%; }
      .tabs button { flex: 1; font-size: 13px; padding: 7px 6px; }
      .plot-card { min-height: 350px; }
      svg { min-height: 250px; }
      .plot-bar span { display: none; }
      .readout { grid-template-columns: 1fr; }
    }
    body.embed .app { height: 100vh; min-height: 0; padding: 8px; }
    body.embed header { display: none; }
    body.embed main { display: block; position: relative; min-height: 0; }
    body.embed .plot-card { height: 100%; min-height: 0; }
    body.embed svg { min-height: 0; }
    body.embed aside {
      position: absolute; left: 15px; bottom: 57px; width: 235px;
      max-height: calc(100% - 115px); overflow-y: auto;
      padding: 8px; border-radius: 10px; background: #fffffff0;
      box-shadow: 0 5px 18px #25476a22;
    }
    body.embed aside h2, body.embed aside .intro, body.embed aside .note,
    body.embed aside .controls-title, body.embed aside .input-row { display: none; }
    body.embed .readout { display: grid; grid-template-columns: 1fr; gap: 3px; }
    body.embed .result { padding: 4px 7px; }
    body.embed .result .name { font-size: 10px; }
    body.embed .result .value { font-size: 14px; }
    body.embed .plot-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 11px; font-size: 11px; }
    body.embed .plot-foot .legend { display: none; }
    body.embed .full-link { display: inline-flex; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="heading"><small>课前数学基础 · 交互实验</small><h1 id="pageTitle">矢量的和与差</h1></div>
      <nav class="tabs" aria-label="实验模式">
        <button type="button" data-mode="add" aria-selected="true">矢量加减</button>
        <button type="button" data-mode="components" aria-selected="false">坐标分解</button>
        <button type="button" data-mode="products" aria-selected="false">点积与叉积</button>
      </nav>
    </header>
    <main>
      <section class="plot-card" aria-label="可拖动的矢量坐标图">
        <div class="plot-bar"><strong>二维直角坐标系</strong><span>每格为 1 个坐标单位 · 拖动箭头端点</span></div>
        <svg id="plane" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="矢量 A、B 的交互坐标图">
          <defs>
            <marker id="arrowA" viewBox="0 0 24 24" refX="3" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto"><path d="M 3 3 L 21 12 L 3 21 Z" fill="#2362c5"/></marker>
            <marker id="arrowB" viewBox="0 0 24 24" refX="3" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto"><path d="M 3 3 L 21 12 L 3 21 Z" fill="#d16b2b"/></marker>
            <marker id="arrowSum" viewBox="0 0 24 24" refX="3" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto"><path d="M 3 3 L 21 12 L 3 21 Z" fill="#168365"/></marker>
            <marker id="arrowDiff" viewBox="0 0 24 24" refX="3" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto"><path d="M 3 3 L 21 12 L 3 21 Z" fill="#8751b5"/></marker>
            <marker id="arrowAxis" viewBox="0 0 14 14" refX="2" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#78899d"/></marker>
          </defs>
          <rect x="0" y="0" width="1000" height="640" fill="#fbfdff"/>
          <g id="grid"></g><g id="drawing"></g>
        </svg>
        <div class="plot-foot"><span id="plotHint">从原点出发拖动 A、B 的箭头尖端，观察和、差随之变化。</span><div class="legend" id="legend"></div><a class="full-link" id="fullLab" href="sim_vectors.html?mode=add" target="_blank" rel="noopener">打开完整实验 ↗</a></div>
      </section>
      <aside>
        <h2 id="panelTitle">看结果</h2>
        <p class="intro" id="intro"></p>
        <div class="readout" id="readout" aria-live="polite"></div>
        <div class="note" id="explain"></div>
        <div class="controls-title"><strong>精确调整坐标</strong><button type="button" class="reset" id="reset">恢复示例</button></div>
        <div class="input-row a"><span class="label">A</span><label>x <input id="ax" type="number" min="-3.8" max="3.8" step="0.1" aria-label="矢量 A 的 x 分量"></label><label>y <input id="ay" type="number" min="-2.5" max="2.5" step="0.1" aria-label="矢量 A 的 y 分量"></label></div>
        <div class="input-row b" id="bRow"><span class="label">B</span><label>x <input id="bx" type="number" min="-3.8" max="3.8" step="0.1" aria-label="矢量 B 的 x 分量"></label><label>y <input id="by" type="number" min="-2.5" max="2.5" step="0.1" aria-label="矢量 B 的 y 分量"></label></div>
      </aside>
    </main>
  </div>
  <script>
    (() => {
      'use strict';
      document.body.classList.toggle('embed', new URLSearchParams(location.search).has('embed'));
      const NS = 'http://www.w3.org/2000/svg';
      const plane = document.getElementById('plane');
      const grid = document.getElementById('grid');
      const drawing = document.getElementById('drawing');
      const readout = document.getElementById('readout');
      const defaults = {
        add: { A: { x: 2.8, y: 1.4 }, B: { x: 1.1, y: 2.3 } },
        components: { A: { x: 3, y: 2 }, B: { x: 1, y: 2 } },
        products: { A: { x: 3, y: 1.2 }, B: { x: .7, y: 2.5 } }
      };
      const copy = p => ({ x: p.x, y: p.y });
      const settings = {
        add: { title: '矢量的和与差', intro: '两支矢量都从 O 点出发。拖动端点，比较“首尾相接”的和与反向相加的差。', hint: '拖动 A、B 的箭头尖端；绿色是 A+B，紫色是 A−B。', legend: [['a', 'A'], ['b', 'B'], ['sum', 'A+B'], ['diff', 'A−B']] },
        components: { title: '矢量的坐标分解', intro: '把 A 沿 x、y 两个正交方向投影。向左或向下时，对应分量为负。', hint: '拖动 A 的端点，观察水平分量 Aₓ 和竖直分量 Aᵧ。', legend: [['a', 'A'], ['sum', 'Aₓ'], ['diff', 'Aᵧ']] },
        products: { title: '点积与叉积', intro: '改变两支矢量的夹角。点积是标量；本图中叉积垂直纸面，显示其 z 分量和方向。', hint: '拖动 A、B 的端点，观察夹角、点积和叉积方向。', legend: [['a', 'A'], ['b', 'B']] }
      };
      let mode = Object.hasOwn(settings, new URLSearchParams(location.search).get('mode'))
        ? new URLSearchParams(location.search).get('mode') : 'add';
      let A = copy(defaults[mode].A), B = copy(defaults[mode].B);
      let dragging = null;
      const OX = 500, OY = 320, UNIT = 60;
      const clamp = (n, low, high) => Math.min(high, Math.max(low, n));
      const nearZero = n => Math.abs(n) < .005 ? 0 : n;
      const fmt = n => nearZero(n).toFixed(2);
      const fmtInput = n => Number(n.toFixed(2)).toString();
      const xy = v => ({ x: OX + v.x * UNIT, y: OY - v.y * UNIT });
      const add = (u, v) => ({ x: u.x + v.x, y: u.y + v.y });
      const sub = (u, v) => ({ x: u.x - v.x, y: u.y - v.y });
      const pair = v => `(${fmt(v.x)}, ${fmt(v.y)})`;
      function el(tag, attrs, parent) {
        const node = document.createElementNS(NS, tag);
        for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
        parent.appendChild(node);
        return node;
      }
      function line(from, to, color, width = 3, marker = null, dash = '') {
        const a = xy(from), b = xy(to);
        // 零矢量没有方向，不能在长度为零的线段上留下悬空箭头。
        const dx = b.x - a.x, dy = b.y - a.y, length = Math.hypot(dx, dy);
        if (length < 1) return null;
        // 杆只画到三角箭头的底边；三角尖端仍精确落在目标坐标。
        const withHead = marker && length >= 26;
        const trim = withHead ? 18 : 0;
        return el('line', { x1: a.x, y1: a.y,
          x2: b.x - dx / length * trim, y2: b.y - dy / length * trim, stroke: color,
          'stroke-width': width, 'stroke-linecap': withHead ? 'butt' : 'round',
          ...(withHead ? { 'marker-end': `url(#${marker})` } : {}),
          ...(dash ? { 'stroke-dasharray': dash } : {}) }, drawing);
      }
      function label(at, text, color, dx = 13, dy = -13) {
        const p = xy(at);
        const t = el('text', { x: p.x + dx, y: p.y + dy, fill: color,
          'font-size': 23, 'font-weight': 750, 'paint-order': 'stroke',
          stroke: '#fff', 'stroke-width': 5, 'stroke-linejoin': 'round' }, drawing);
        t.textContent = text;
      }
      function vector(v, color, marker, text, width = 5) {
        line({ x: 0, y: 0 }, v, color, width, marker);
        // 靠近原点时让读数面板说明数值，避免多支零矢量的标签挤成一团。
        if (Math.hypot(v.x, v.y) * UNIT >= 28) label(v, text, color);
      }
      function handle(v, name) {
        const p = xy(v);
        const group = el('g', { 'data-drag': name, style: 'cursor: grab' }, drawing);
        el('circle', { cx: p.x, cy: p.y, r: 30, fill: 'transparent' }, group);
      }
      function result(name, value, color = '') {
        return `<div class="result ${color}"><div class="name">${name}</div><div class="value">${value}</div></div>`;
      }
      function drawGrid() {
        for (let x = -8; x <= 8; x++) {
          const px = OX + x * UNIT;
          if (x !== 0) el('line', { x1: px, y1: 22, x2: px, y2: 618, stroke: '#e8edf4', 'stroke-width': 1 }, grid);
          if (x !== 0) { const t = el('text', { x: px, y: OY + 21, 'text-anchor': 'middle', fill: '#8090a2', 'font-size': 16 }, grid); t.textContent = x; }
        }
        for (let y = -5; y <= 5; y++) {
          const py = OY - y * UNIT;
          if (y !== 0) el('line', { x1: 22, y1: py, x2: 978, y2: py, stroke: '#e8edf4', 'stroke-width': 1 }, grid);
          if (y !== 0) { const t = el('text', { x: OX - 15, y: py + 5, 'text-anchor': 'end', fill: '#8090a2', 'font-size': 16 }, grid); t.textContent = y; }
        }
        el('line', { x1: 22, y1: OY, x2: 968, y2: OY, stroke: '#78899d', 'stroke-width': 2, 'marker-end': 'url(#arrowAxis)' }, grid);
        el('line', { x1: OX, y1: 618, x2: OX, y2: 32, stroke: '#78899d', 'stroke-width': 2, 'marker-end': 'url(#arrowAxis)' }, grid);
        for (const [x, y, text] of [[OX - 22, OY + 24, 'O'], [965, OY - 12, 'x'], [OX + 14, 38, 'y']]) {
          const t = el('text', { x, y, fill: '#54657b', 'font-size': 20, 'font-weight': 700 }, grid); t.textContent = text;
        }
      }
      function renderAdd() {
        const sum = add(A, B), diff = sub(A, B);
        line(A, sum, '#9dc9bb', 2.5, null, '8 7');
        line(B, sum, '#9dc9bb', 2.5, null, '8 7');
        line(A, diff, '#c7b0dc', 2.5, null, '8 7');
        vector(sum, '#168365', 'arrowSum', 'A+B', 5);
        vector(diff, '#8751b5', 'arrowDiff', 'A−B', 5);
        vector(A, '#2362c5', 'arrowA', 'A');
        vector(B, '#d16b2b', 'arrowB', 'B');
        handle(A, 'A'); handle(B, 'B');
        readout.innerHTML = result('蓝色矢量 A', pair(A)) + result('橙色矢量 B', pair(B), 'orange')
          + result('和 A+B', pair(sum), 'green') + result('差 A−B', pair(diff), 'purple');
        document.getElementById('explain').textContent = `按分量计算：A+B = (${fmt(A.x)}+${fmt(B.x)}, ${fmt(A.y)}+${fmt(B.y)})；A−B = (${fmt(A.x)}−${fmt(B.x)}, ${fmt(A.y)}−${fmt(B.y)})。虚线表示平移后的矢量，平移不改变矢量。`;
      }
      function renderComponents() {
        const px = { x: A.x, y: 0 };
        line(px, A, '#8751b5', 4, 'arrowDiff');
        line({ x: 0, y: 0 }, px, '#168365', 4, 'arrowSum');
        line({ x: 0, y: A.y }, A, '#9cb6d9', 2, null, '6 7');
        vector(A, '#2362c5', 'arrowA', 'A', 5);
        if (Math.abs(A.x) * UNIT >= 28)
          label({ x: A.x / 2, y: 0 }, 'Aₓ', '#168365', -17, A.y >= 0 ? 28 : -14);
        if (Math.abs(A.y) * UNIT >= 28)
          label({ x: A.x, y: A.y / 2 }, 'Aᵧ', '#8751b5', A.x >= 0 ? 14 : -44, 5);
        handle(A, 'A');
        const mag = Math.hypot(A.x, A.y);
        const direction = mag < .005 ? '未定义（零矢量）' : `${(Math.atan2(A.y, A.x) * 180 / Math.PI + 360) % 360 < .05 ? '0.0' : ((Math.atan2(A.y, A.x) * 180 / Math.PI + 360) % 360).toFixed(1)}°`;
        readout.innerHTML = result('A 的坐标', pair(A))
          + result('水平分量 Aₓ', fmt(A.x), 'green') + result('竖直分量 Aᵧ', fmt(A.y), 'purple')
          + result('模长 |A|', fmt(mag)) + result('与 +x 轴逆时针夹角', direction);
        document.getElementById('explain').textContent = `A = Aₓ i + Aᵧ j = ${fmt(A.x)} i ${A.y < 0 ? '−' : '+'} ${fmt(Math.abs(A.y))} j；|A| = √(Aₓ²+Aᵧ²)。角度从 +x 轴逆时针量起。`;
      }
      function renderProducts() {
        const dot = A.x * B.x + A.y * B.y;
        const cross = A.x * B.y - A.y * B.x;
        const ma = Math.hypot(A.x, A.y), mb = Math.hypot(B.x, B.y);
        let angleText = '未定义';
        if (ma > .005 && mb > .005) {
          const signed = Math.atan2(cross, dot);
          const r = 55, a0 = Math.atan2(A.y, A.x), a1 = a0 + signed;
          const start = { x: OX + r * Math.cos(a0), y: OY - r * Math.sin(a0) };
          const end = { x: OX + r * Math.cos(a1), y: OY - r * Math.sin(a1) };
          el('path', { d: `M ${start.x} ${start.y} A ${r} ${r} 0 0 ${signed >= 0 ? 0 : 1} ${end.x} ${end.y}`,
            fill: 'none', stroke: '#b66a21', 'stroke-width': 3 }, drawing);
          const mid = a0 + signed / 2;
          const t = el('text', { x: OX + 78 * Math.cos(mid), y: OY - 78 * Math.sin(mid),
            fill: '#9b571a', 'font-size': 21, 'font-weight': 700, 'text-anchor': 'middle',
            'paint-order': 'stroke', stroke: '#fff', 'stroke-width': 5 }, drawing);
          t.textContent = 'θ';
          angleText = `${(Math.abs(signed) * 180 / Math.PI).toFixed(1)}°`;
        }
        vector(A, '#2362c5', 'arrowA', 'A');
        vector(B, '#d16b2b', 'arrowB', 'B');
        handle(A, 'A'); handle(B, 'B');
        const crossZero = Math.abs(cross) < .005 || ma < .005 || mb < .005;
        const z = crossZero ? '零向量，无方向' : cross > 0 ? '⊙ 指向纸面外（+z）' : '⊗ 指向纸面内（−z）';
        const dotMeaning = ma < .005 || mb < .005 ? '零矢量与任何矢量的点积、叉积均为 0。'
          : Math.abs(dot) < .005 ? '夹角约为 90°，两矢量正交，点积为 0。'
          : dot > 0 ? '夹角为锐角，点积为正。' : '夹角为钝角，点积为负。';
        readout.innerHTML = result('夹角 θ（0°—180°）', angleText)
          + result('点积 A·B = AₓBₓ+AᵧBᵧ', fmt(dot), 'green')
          + result('叉积 z 分量 AₓBᵧ−AᵧBₓ', fmt(cross), 'purple')
          + result('A×B 的方向', z, cross >= 0 ? 'green' : 'purple');
        const turn = crossZero ? '两矢量共线或有零矢量时，叉积没有方向。'
          : cross > 0 ? '从 A 转向 B 是逆时针；右手四指沿此方向弯曲，拇指指向纸面外。'
          : '从 A 转向 B 是顺时针；右手四指沿此方向弯曲，拇指指向纸面内。';
        document.getElementById('explain').textContent = `${dotMeaning} 点积 = |A||B|cosθ；叉积大小 = |A||B|sinθ。${turn}`;
      }
      function render() {
        drawing.replaceChildren();
        if (mode === 'add') renderAdd();
        else if (mode === 'components') renderComponents();
        else renderProducts();
        for (const [id, n] of [['ax', A.x], ['ay', A.y], ['bx', B.x], ['by', B.y]]) {
          const input = document.getElementById(id);
          if (document.activeElement !== input) input.value = fmtInput(n);
        }
      }
      function setMode(next, changeUrl = true) {
        if (!Object.hasOwn(settings, next)) return;
        mode = next; A = copy(defaults[mode].A); B = copy(defaults[mode].B);
        document.getElementById('pageTitle').textContent = settings[mode].title;
        document.getElementById('panelTitle').textContent = settings[mode].title;
        document.getElementById('intro').textContent = settings[mode].intro;
        document.getElementById('plotHint').textContent = settings[mode].hint;
        document.getElementById('bRow').hidden = mode === 'components';
        document.getElementById('legend').innerHTML = settings[mode].legend.map(([cls, text]) => `<span class="${cls}">${text}</span>`).join('');
        document.getElementById('fullLab').href = `sim_vectors.html?mode=${mode}`;
        document.querySelectorAll('[data-mode]').forEach(button => button.setAttribute('aria-selected', String(button.dataset.mode === mode)));
        if (changeUrl) history.replaceState(null, '', `${location.pathname}?mode=${mode}`);
        render();
      }
      plane.addEventListener('pointerdown', event => {
        const target = event.target.closest('[data-drag]');
        if (!target) return;
        dragging = target.getAttribute('data-drag');
        plane.setPointerCapture(event.pointerId);
        event.preventDefault();
      });
      plane.addEventListener('pointermove', event => {
        if (!dragging) return;
        const transform = plane.getScreenCTM();
        if (!transform) return;
        const p = new DOMPoint(event.clientX, event.clientY).matrixTransform(transform.inverse());
        const v = dragging === 'A' ? A : B;
        v.x = clamp((p.x - OX) / UNIT, -3.8, 3.8);
        v.y = clamp((OY - p.y) / UNIT, -2.5, 2.5);
        render();
      });
      const endDrag = () => { dragging = null; };
      plane.addEventListener('pointerup', endDrag);
      plane.addEventListener('pointercancel', endDrag);
      plane.addEventListener('lostpointercapture', endDrag);
      document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
      document.getElementById('reset').addEventListener('click', () => setMode(mode, false));
      for (const id of ['ax', 'ay', 'bx', 'by']) {
        const input = document.getElementById(id);
        input.addEventListener('change', () => {
          const n = Number(input.value);
          if (!Number.isFinite(n)) { render(); return; }
          const v = id[0] === 'a' ? A : B;
          v[id[1]] = clamp(n, id[1] === 'x' ? -3.8 : -2.5, id[1] === 'x' ? 3.8 : 2.5);
          input.blur(); render();
        });
      }
      window.addEventListener('message', event => { if (event.data?.type === 'reset') setMode(mode, false); });
      drawGrid(); setMode(mode, false);
    })();
  </script>
</body>
</html>
