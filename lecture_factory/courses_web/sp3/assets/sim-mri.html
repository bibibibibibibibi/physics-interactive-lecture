<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>射频匹配与净磁化 · sp3</title>
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#f3f8ff;color:#17324d;font:23px/1.35 "PingFang SC","Microsoft YaHei",sans-serif}body{padding:10px;display:flex;flex-direction:column;gap:9px}.controls{display:flex;align-items:center;gap:15px;flex-wrap:wrap;flex:none}button{font:inherit;padding:7px 15px;color:#245ea0;border:1px solid #88a7ca;border-radius:8px;background:#fff;cursor:pointer}button:hover{background:#e6f1ff}button:focus-visible,input:focus-visible{outline:3px solid #bd700e;outline-offset:2px}label{white-space:nowrap}output{font-variant-numeric:tabular-nums;color:#245ea0;font-weight:700}input{width:210px;accent-color:#245ea0}.setting{color:#586e84;font-size:21px}.figures{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}.panel{background:#fff;border:1px solid #d4e2ef;border-radius:13px;padding:10px 14px;display:flex;flex-direction:column;min-height:0}h2{font-size:25px;color:#245ea0;margin:0 0 3px}.canvaswrap{flex:1;min-height:0}canvas{width:100%;height:100%;display:block}.values{font-size:21px;color:#17324d;font-variant-numeric:tabular-nums;white-space:nowrap}.stage{color:#b05d0e;font-weight:600;font-size:21px;white-space:nowrap}.footer{font-size:20px;color:#586e84;flex:none;line-height:1.35;margin:0}.progress{width:140px}@media(max-width:1200px){html,body{font-size:20px}.controls{gap:10px}button{padding:6px 11px}input{width:160px}.setting,.stage,.values{font-size:18px}h2{font-size:22px}.footer{font-size:18px}}
</style></head><body>
<section class="controls"><button id="play">开始</button><button id="reset">复位</button><label for="detune">对照失谐 Δ/Ω₁=<output id="detune-out">3.0</output></label><input id="detune" type="range" min="0" max="5" step="0.1" value="3"><button id="matched">设为匹配</button><button id="detuned">设为3Ω₁</button><span class="setting">固定 B₀、RF强度和脉冲时长；Ω₁tₚ=π/2</span></section>
<section class="figures"><article class="panel"><h2>匹配：Δ=0</h2><div class="canvaswrap"><canvas id="match-plot" aria-label="匹配条件下的净磁化与收信投影"></canvas></div><div class="values" id="match-values"></div></article><article class="panel"><h2 id="other-title">失谐对照：Δ=3Ω₁</h2><div class="canvaswrap"><canvas id="detune-plot" aria-label="失谐条件下的净磁化与收信投影"></canvas></div><div class="values" id="detune-values"></div></article></section>
<section class="controls"><span class="stage" id="stage">准备：净磁化沿 z 轴</span><label for="progress">动画进度</label><input class="progress" id="progress" type="range" min="0" max="10" step="0.01" value="0"><output id="progress-out">0%</output></section>
<p class="footer">激发在旋转系计算；收信切到实验室系，进动慢放、T₂*衰减仅作定性示意。此处展示自旋净磁化，非机械振子，也非完整MRI重建。</p>
<script>
'use strict';
const $=id=>document.getElementById(id),pulseSeconds=4,endTime=10,initial=[0,0,1];
const q=new URLSearchParams(location.search),expectedPage=Number(q.get('page')||21),demoStep=Number(q.get('demoStep')||2);
let detuning=3,time=0,running=false,startStamp=performance.now(),lecture=null,manual=true,pageStart=null,anchor=null;
// Rodrigues rotation about the rotating-frame effective field (Omega1, 0, Delta).
// Omega1 and Delta share units; the dimensionless pulse area is Omega1*t_p = pi/2.
function pulseMagnetization(delta,fraction=1){const norm=Math.hypot(1,delta),nx=1/norm,nz=delta/norm,theta=Math.PI/2*fraction*norm,c=Math.cos(theta),s=Math.sin(theta);return[nx*nz*(1-c),-nx*s,c+nz*nz*(1-c)]}
function receivedMagnetization(delta,elapsed){const m=pulseMagnetization(delta),decay=Math.exp(-elapsed/3),angle=2*Math.PI*.5*elapsed,c=Math.cos(angle),s=Math.sin(angle);return[decay*(c*m[0]-s*m[1]),decay*(s*m[0]+c*m[1]),m[2]]}
function state(delta,t){return t<=pulseSeconds?pulseMagnetization(delta,t/pulseSeconds):receivedMagnetization(delta,t-pulseSeconds)}
function setDetuning(value,{fromLecture=false}={}){detuning=Math.max(0,Math.min(5,Number(value)));$('detune').value=detuning;$('detune-out').textContent=detuning.toFixed(1);$('other-title').textContent=(detuning===0?'匹配对照':'失谐对照')+'：Δ='+detuning.toFixed(1)+'Ω₁';if(!fromLecture){manual=true;time=0;running=false;startStamp=performance.now();$('play').textContent='开始';render()}}
function reset(){setDetuning(3)}
function play(){manual=true;if(running){running=false}else{if(time>=endTime)time=0;startStamp=performance.now()-time*1000;running=true}$('play').textContent=running?'暂停':'继续';render()}
$('play').onclick=play;$('reset').onclick=reset;$('matched').onclick=()=>setDetuning(0);$('detuned').onclick=()=>setDetuning(3);$('detune').oninput=e=>setDetuning(+e.target.value);$('progress').oninput=e=>{manual=true;time=+e.target.value;running=false;$('play').textContent='继续';render()};
function audio(){if(parent===window)return null;try{return parent.document.querySelector('audio')}catch{return null}}
if(q.has('page'))fetch('./weblec.json').then(r=>r.ok?r.json():Promise.reject()).then(data=>{const p=data.slides.find(p=>p.id===expectedPage);pageStart=p?.t_start??null;anchor=p?.stepTimes?.[demoStep]??null}).catch(()=>{});
function receiveLectureState(d){
 if(!['interactive','static'].includes(d.mode)||Number(d.pageId)!==expectedPage||!Number.isFinite(d.pageTime)||!Number.isInteger(d.step)||d.step<0)return;
 const a=audio(),start=d.steps?.[demoStep],next={mode:d.mode,pageId:d.pageId,pageTime:Math.max(0,d.pageTime),step:d.step,playing:!!d.playing,start:Number.isFinite(start)&&start>=0?start:null,audioTime:a?.currentTime??null};
 const same=lecture&&lecture.mode===next.mode&&lecture.step===next.step&&lecture.start===next.start&&lecture.playing===next.playing&&Math.abs(lecture.pageTime-next.pageTime)<1e-9;
 lecture=next;if(manual&&same&&!next.playing)return;manual=false;applyLectureClock();render();
}
function applyLectureClock(){
 let pageTime=lecture.pageTime;const a=audio();
 if(lecture.mode==='interactive'&&a){if(Number.isFinite(anchor)&&Number.isFinite(pageStart)&&Math.abs(anchor-pageStart-lecture.start)<.003)pageTime=a.currentTime-pageStart;else if(lecture.playing&&Number.isFinite(lecture.audioTime))pageTime+=a.currentTime-lecture.audioTime}
 setDetuning(3,{fromLecture:true});
 time=lecture.start===null||lecture.step<demoStep?0:lecture.mode==='static'?(lecture.step>demoStep?7:pulseSeconds):Math.max(0,Math.min(endTime,pageTime-lecture.start));
 running=lecture.start!==null&&lecture.step>=demoStep&&pageTime>=lecture.start&&lecture.mode==='interactive'&&lecture.playing&&(!a||!a.paused)&&time<endTime;
 $('play').textContent=running?'暂停':'开始';
}
window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.type==='lecture-state')receiveLectureState(e.data);if(e.data?.type==='reset')reset();if(e.data?.type==='demo'){reset();play()}});
function context(canvas){const b=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.max(1,b.width),h=Math.max(1,b.height);if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}const c=canvas.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);return{c,w,h}}
function arrow(c,x,y,xx,yy,color,width=4){const angle=Math.atan2(yy-y,xx-x);c.strokeStyle=color;c.fillStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x,y);c.lineTo(xx,yy);c.stroke();c.beginPath();c.moveTo(xx,yy);c.lineTo(xx-13*Math.cos(angle-.38),yy-13*Math.sin(angle-.38));c.lineTo(xx-13*Math.cos(angle+.38),yy-13*Math.sin(angle+.38));c.closePath();c.fill()}
function draw(canvas,delta,color){const{c,w,h}=context(canvas),font=innerWidth>=1200?22:19;c.font=font+'px "PingFang SC",sans-serif';const O={x:w*.26,y:h*.61},scale=Math.min(h*.37,w*.20),project=m=>({x:O.x+scale*(m[1]-.55*m[0]),y:O.y+scale*(-m[2]+.40*m[0])});
 c.fillStyle='#eef5ff';c.beginPath();c.ellipse(O.x,O.y,scale,scale*.32,0,0,2*Math.PI);c.fill();c.strokeStyle='#d7e3f2';c.lineWidth=2;c.stroke();
 for(const[vector,label]of [[[0,0,1.15],'z ∥ B₀'],[[0,1.25,0],'y'],[[1.3,0,0],'x']]){const p=project(vector);arrow(c,O.x,O.y,p.x,p.y,'#8c9eb1',2);c.fillStyle='#586e84';c.fillText(label,p.x+6,p.y)}
 const m=state(delta,time),p=project(m);arrow(c,O.x,O.y,p.x,p.y,color,5);c.fillStyle=color;c.fillText('M',p.x+8,p.y+23);
 if(time<=pulseSeconds){const n=project([1/Math.hypot(1,delta),0,delta/Math.hypot(1,delta)]);c.save();c.setLineDash([5,5]);arrow(c,O.x,O.y,n.x,n.y,'#b05d0e',2);c.restore();c.fillStyle='#b05d0e';c.fillText('有效场',w*.34,52)}
 c.fillStyle='#586e84';c.fillText(time<=pulseSeconds?'旋转系：激发':'实验室系：自由进动',10,21);
 const l=w*.53,r=w-14,top=50,bottom=h-30,mid=(top+bottom)/2,Y=v=>mid-v*(bottom-top)/2.2;
 c.strokeStyle='#dde6f1';c.lineWidth=1;c.beginPath();c.moveTo(l,top);c.lineTo(l,bottom);c.moveTo(l,mid);c.lineTo(r,mid);c.stroke();c.fillStyle='#586e84';c.fillText('接收线圈：Mx 投影',l,25);
 c.fillText('0',l-19,mid+7);c.fillText('1',l-19,top+8);c.fillText('−1',l-31,bottom+4);
 if(time>pulseSeconds){const elapsed=time-pulseSeconds;c.strokeStyle=color;c.lineWidth=3.2;c.beginPath();for(let i=0;i<=250;i++){const u=6*i/250;if(u>elapsed)break;const x=l+(r-l)*u/6,y=Y(receivedMagnetization(delta,u)[0]);i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();c.save();c.setLineDash([5,6]);const xy=Math.hypot(...pulseMagnetization(delta).slice(0,2));for(const sign of [-1,1]){c.beginPath();for(let i=0;i<=250;i++){const u=6*i/250,x=l+(r-l)*u/6,y=Y(sign*xy*Math.exp(-u/3));i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}c.restore()}
 else{c.fillStyle='#586e84';c.fillText('脉冲结束后开始收信',l+9,mid-10)}
 c.fillStyle='#586e84';c.fillText('慢放示意时间 →',l,bottom+26);
 const xy=Math.hypot(m[0],m[1]),end=pulseMagnetization(delta),endxy=Math.hypot(end[0],end[1]);return{m,xy,endxy,norm:Math.hypot(...m)};
}
function render(){const a=draw($('match-plot'),0,'#245ea0'),b=draw($('detune-plot'),detuning,'#b05d0e');$('match-values').textContent=`Mxy=${a.xy.toFixed(3)}　Mz=${a.m[2].toFixed(3)}　脉冲末 Mxy=1.000`;$('detune-values').textContent=`Mxy=${b.xy.toFixed(3)}　Mz=${b.m[2].toFixed(3)}　脉冲末 Mxy=${b.endxy.toFixed(3)}`;$('stage').textContent=lecture&&!manual&&lecture.start===null?'课堂锚点缺失：保持初态':lecture&&!manual&&lecture.mode==='static'&&time>0?(time===pulseSeconds?'静态：脉冲末净磁化':'静态：脉冲后收信示意'):time===0?'准备：净磁化沿 z 轴':time<=pulseSeconds?'RF激发：同样脉冲，不同失谐':'脉冲结束：收信与T₂*衰减（定性）';$('progress').value=time;$('progress-out').textContent=Math.round(time/endTime*100)+'%';window.sp3MRIState={detuning,time,running,manual,clockSource:lecture&&!manual?'lecture-state':'local',timelineMode:lecture?.mode??null,timelineAnchorStatus:lecture?(lecture.start===null?'missing':'ready'):'none',stage:time<=pulseSeconds?'pulse':'receive',matched:a.m,detuned:b.m,matchedNorm:a.norm,detunedNorm:b.norm,matchedMxy:a.xy,detunedMxy:b.xy,detunedPulseMxy:b.endxy}}
window.sp3MRI={pulseMagnetization,receivedMagnetization,state,setDetuning,reset,setTime(t){manual=true;time=Math.max(0,Math.min(endTime,t));running=false;render()},getState:()=>({...window.sp3MRIState})};
function frame(){if(lecture&&lecture.playing)manual=false;if(lecture&&!manual)applyLectureClock();else if(running){time=Math.min(endTime,(performance.now()-startStamp)/1000);if(time>=endTime){running=false;$('play').textContent='重播'}}render();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
</script></body></html>
